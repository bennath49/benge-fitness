<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Benge Fitness Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #121212;
      --accent: #0066ff;
      --accent-dark: #004ccc;
      --success: #28a745;
      --danger: #ff4444;
      --text: #e0e0e0;
      --superset: #ff6b6b33;
      --light-bg: #f8f9fa;
      --light-card: #ffffff;
      --light-text: #212529;
    }
    body.light {
      --bg: var(--light-bg);
      --card: var(--light-card);
      --text: var(--light-text);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    header {
      background: #111;
      padding: 1.2rem;
      font-size: 1.7rem;
      font-weight: 700;
      text-align: center;
      border-bottom: 1px solid #222;
    }
    body.light header { background: #e9ecef; color: #212529; border-bottom: 1px solid #dee2e6; }
    .container { max-width: 760px; margin: 0 auto; padding: 1rem; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin: 1.2rem 0;
    }
    .tab {
      padding: 1rem;
      background: #1e1e1e;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    body.light .tab { background: #dee2e6; }
    .tab.active { background: var(--accent); color: white; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.4rem;
      margin-bottom: 1.4rem;
      border: 1px solid #222;
    }
    body.light .card { border: 1px solid #ced4da; }
    button, select, input {
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }
    select, input { background: #1e1e1e; color: white; width: 100%; margin: 0.5rem 0; }
    body.light select, body.light input { background: #f1f3f5; color: #212529; }
    button { background: var(--accent); color: white; cursor: pointer; transition: 0.2s; }
    button:hover { background: var(--accent-dark); }
    .success-btn { background: var(--success); }
    .success-btn:hover { background: #218838; }
    .danger-btn { background: var(--danger); font-size: 0.9rem; padding: 0.6rem 1rem; }
    .exercise-container { display: flex; gap: 1.2rem; margin-bottom: 1.2rem; }
    .muscle-visual {
      width: 130px;
      height: 130px;
      background: #2c2c2c;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: #888;
      flex-shrink: 0;
    }
    body.light .muscle-visual { background: #e9ecef; color: #495057; }
    .exercise-card {
      flex: 1;
      background: #181818;
      border-radius: 10px;
      padding: 1.2rem;
      border: 1px solid #282828;
    }
    body.light .exercise-card { background: #f8f9fa; border: 1px solid #ced4da; }
    .superset-group {
      background: var(--superset);
      padding: 1.2rem;
      border-radius: 10px;
      margin: 1.2rem 0;
      position: relative;
    }
    .arrow-line {
      position: absolute;
      left: 50%;
      top: 100%;
      width: 3px;
      height: 50px;
      background: #ff6b6b;
      transform: translateX(-50%);
    }
    .arrow-line::after {
      content: '↓';
      position: absolute;
      bottom: -24px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff6b6b;
      font-size: 1.8rem;
      font-weight: bold;
    }
    .timer-area { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; }
    .main-timer { font-size: 3.5rem; font-weight: bold; letter-spacing: 3px; }
    .stats-box { font-size: 1.1rem; text-align: right; }
    .rest-display { font-size: 3rem; text-align: center; margin: 1rem 0; font-weight: 600; }
    .history-item { padding: 1.2rem 0; border-bottom: 1px solid #222; }
    body.light .history-item { border-bottom: 1px solid #dee2e6; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>Benge Fitness Pro</header>

<div class="container">

  <div class="tabs">
    <div class="tab active" onclick="showTab('workout')">Workout</div>
    <div class="tab" onclick="showTab('history')">History</div>
    <div class="tab" onclick="showTab('progress')">Progress</div>
    <div class="tab" onclick="showTab('settings')">Settings</div>
  </div>

  <!-- WORKOUT TAB -->
  <div id="workoutTab">
    <div class="card" id="startScreen">
      <h3>Start New Workout</h3>
      <select id="categorySelect">
        <option value="Chest">Chest</option>
        <option value="Back">Back</option>
        <option value="Legs">Legs</option>
        <option value="Cardio">Cardio</option>
      </select>
      <button class="success-btn" style="width:100%;margin-top:1rem;font-size:1.1rem;" onclick="startNewWorkout()">Begin</button>
    </div>

    <div id="activeWorkout" class="hidden">
      <div class="card timer-area">
        <div>
          <div class="main-timer" id="workoutTimer">00:00</div>
        </div>
        <div class="stats-box">
          Calories (est): <b id="calDisplay">0</b> kcal<br>
          Volume: <b id="volDisplay">0</b> lb<br><br>
          <button onclick="finishWorkout()" style="font-size:1.1rem;padding:0.8rem 1.8rem;">Finish & Save</button>
        </div>
      </div>

      <div id="exercisesContainer"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin:1.4rem 0;">
        <button class="success-btn" onclick="addExercisePrompt()">+ Add Exercise</button>
        <button onclick="groupSuperset()">Group Superset</button>
      </div>

      <div class="card">
        <h3>Rest Timer (auto-starts 2 min after set)</h3>
        <div class="rest-display" id="restTimer">—</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0.6rem;">
          <button onclick="startRest(60)">60s</button>
          <button onclick="startRest(90)">90s</button>
          <button onclick="startRest(120)">120s</button>
          <button onclick="startRest(180)">180s</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HISTORY TAB (simplified - expand as needed) -->
  <div id="historyTab" class="hidden">
    <div class="card">
      <h3>Workout History</h3>
      <button onclick="exportHistory()" style="margin-bottom:1rem;">Export to CSV</button>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- PROGRESS & SETTINGS TABS (placeholders - add your previous logic here) -->
  <div id="progressTab" class="hidden"><div class="card"><h3>Progress View (placeholder)</h3></div></div>
  <div id="settingsTab" class="hidden">
    <div class="card">
      <h3>Settings</h3>
      <label>Bodyweight (lb):</label>
      <input type="number" id="bodyweightInput" value="200">
      <select id="themeSelect">
        <option value="dark">Dark Mode</option>
        <option value="light">Light Mode</option>
      </select>
      <button style="width:100%;margin:1rem 0;" onclick="saveSettings()">Save</button>
      <button class="danger-btn" style="width:100%;" onclick="clearAllData()">Clear History</button>
    </div>
  </div>

</div>

<script>
// ──────────────────────────────────────────────── DATA ────────────────────────────────────────────────
const MUSCLE_ALTERNATIVES = {
  chest: [
    "Barbell Bench Press", "Incline Bench Press", "Decline Bench Press", "Dumbbell Flyes",
    "Cable Chest Fly", "Machine Chest Press", "Push-Ups", "Dips (Chest Focus)",
    "Pec Deck Machine", "Incline Dumbbell Press"
  ],
  back: [
    "Lat Pulldown", "Seated Cable Row", "Pull-Up", "Bent-Over Barbell Row",
    "Deadlift", "T-Bar Row", "Face Pull", "Hammer Strength Row",
    "Landmine Row", "Inverted Row"
  ],
  legs: [
    "Back Squat", "Leg Press", "Romanian Deadlift", "Walking Lunges",
    "Leg Extension", "Seated Leg Curl", "Hip Thrust", "Calf Raise",
    "Sumo Deadlift", "Bulgarian Split Squat"
  ],
  arms: [
    "Barbell Curl", "Hammer Curl", "Tricep Pushdown", "Overhead Tricep Extension",
    "Skullcrusher", "Preacher Curl", "Concentration Curl", "Tricep Kickback",
    "Close-Grip Bench Press", "Chin-Up"
  ],
  shoulders: [
    "Overhead Press", "Lateral Raise", "Front Raise", "Upright Row",
    "Arnold Press", "Rear Delt Fly", "Shrug", "Cable Lateral Raise",
    "Military Press", "Face Pull"
  ],
  cardio: ["Treadmill", "Stair Climber", "Rowing Machine", "Bike", "Jump Rope"]
};

let currentExercises = [];
let caloriesBurned = 0;
let totalVolume = 0;
let workoutStartTime, timerInterval, restTimer;
let bodyweight = parseInt(localStorage.getItem('benge_bw')) || 200;
let theme = localStorage.getItem('benge_theme') || 'dark';

document.body.classList.toggle('light', theme === 'light');
document.getElementById('bodyweightInput').value = bodyweight;
document.getElementById('themeSelect').value = theme;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// ──────────────────────────────────────────────── CORE FUNCTIONS ────────────────────────────────────────────────
function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');

  ['workout','history','progress','settings'].forEach(t => {
    document.getElementById(t + 'Tab').classList.toggle('hidden', t !== tab);
  });
}

function startNewWorkout() {
  currentExercises = [];
  caloriesBurned = 0;
  totalVolume = 0;
  workoutStartTime = Date.now();

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const sec = Math.floor((Date.now() - workoutStartTime) / 1000);
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = (sec % 60).toString().padStart(2, '0');
    document.getElementById('workoutTimer').textContent = m + ':' + s;
  }, 1000);

  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('activeWorkout').classList.remove('hidden');

  // Example presets — customize per your preference
  ["Barbell Bench Press", "Lat Pulldown", "Back Squat", "Treadmill"].forEach(n => addExercise(n));
  renderExercises();
  updateStats();
}

function addExercise(name) {
  currentExercises.push({
    name,
    sets: []
  });
  renderExercises();
}

function addExercisePrompt() {
  const name = prompt("Exercise name:");
  if (name?.trim()) addExercise(name.trim());
}

function renderExercises() {
  const container = document.getElementById('exercisesContainer');
  container.innerHTML = '';

  let prevGroup = null;

  currentExercises.forEach((ex, i) => {
    const isNewGroup = ex.supersetGroup && ex.supersetGroup !== prevGroup;
    if (prevGroup && isNewGroup) container.innerHTML += '</div>';

    if (isNewGroup) {
      container.innerHTML += '<div class="superset-group">';
      prevGroup = ex.supersetGroup;
    }

    const card = document.createElement('div');
    card.className = 'exercise-container';
    card.innerHTML = `
      <div class="muscle-visual">${ex.name.includes('Chest')||ex.name.includes('Bench')||ex.name.includes('Fly')?'Chest': 
        ex.name.includes('Back')||ex.name.includes('Row')||ex.name.includes('Pull')?'Back':
        ex.name.includes('Leg')||ex.name.includes('Squat')||ex.name.includes('Lunge')?'Legs':
        'Other'}</div>
      <div class="exercise-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;">
          <strong>${ex.name}</strong>
          <div>
            <button onclick="moveExercise(${i},-1)">↑</button>
            <button onclick="moveExercise(${i},1)">↓</button>
          </div>
        </div>
        <div class="set-row">
          <input type="number" placeholder="Weight" id="w_${i}">
          <input type="number" placeholder="Reps" id="r_${i}">
          <button onclick="logSet(${i})">Log</button>
        </div>
        <div id="sets_${i}"></div>
        <div style="margin-top:1rem;display:flex;gap:0.8rem;">
          <button class="danger-btn" onclick="removeExercise(${i})">Remove</button>
          <button onclick="showReplaceOptions(${i})">Replace</button>
        </div>
      </div>
    `;
    container.appendChild(card);

    ex.sets.forEach((s, si) => {
      const setDiv = document.createElement('div');
      setDiv.innerHTML = `${s.weight || 'BW'} × ${s.reps} <button class="danger-btn" onclick="removeSet(${i},${si})">×</button>`;
      document.getElementById(`sets_${i}`).appendChild(setDiv);
    });

    if (ex.supersetGroup && i < currentExercises.length - 1 && currentExercises[i+1].supersetGroup === ex.supersetGroup) {
      container.innerHTML += '<div class="arrow-line"></div>';
    }
  });

  if (prevGroup) container.innerHTML += '</div>';
}

function moveExercise(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= currentExercises.length) return;
  [currentExercises[idx], currentExercises[newIdx]] = [currentExercises[newIdx], currentExercises[idx]];
  renderExercises();
}

function logSet(idx) {
  const w = parseFloat(document.getElementById(`w_${idx}`).value) || 0;
  const r = parseInt(document.getElementById(`r_${idx}`).value);

  if (!r || r < 1) return alert("Enter valid reps");

  currentExercises[idx].sets.push({weight: w, reps: r});

  caloriesBurned += Math.round(5 + (bodyweight * 0.1) + (r * 2));
  totalVolume += w * r;

  updateStats();
  renderExercises();

  startRest(120); // auto 2-minute rest
}

function showReplaceOptions(idx) {
  const name = currentExercises[idx].name.toLowerCase();
  let muscle = 'chest';
  if (name.includes('row') || name.includes('pull') || name.includes('lat')) muscle = 'back';
  if (name.includes('squat') || name.includes('leg') || name.includes('lunge') || name.includes('deadlift')) muscle = 'legs';
  if (name.includes('curl') || name.includes('tricep') || name.includes('pushdown')) muscle = 'arms';
  if (name.includes('press') || name.includes('raise') || name.includes('shrug')) muscle = 'shoulders';

  const alts = MUSCLE_ALTERNATIVES[muscle] || [];
  if (!alts.length) return alert("No replacements found for this exercise");

  let html = `<h4>Replace ${currentExercises[idx].name} with:</h4><ul style="list-style:none;padding:0;">`;
  alts.slice(0,10).forEach(opt => {
    html += `<li><button onclick="replaceExercise(${idx},'${opt}');this.closest('div').remove()">${opt}</button></li>`;
  });
  html += '</ul><button onclick="this.parentElement.remove()">Close</button>';

  const popup = document.createElement('div');
  popup.style.cssText = 'position:fixed;top:20%;left:50%;transform:translateX(-50%);background:var(--card);padding:1.5rem;border-radius:12px;border:2px solid var(--accent);max-width:420px;z-index:1000;';
  popup.innerHTML = html;
  document.body.appendChild(popup);
}

function replaceExercise(idx, newName) {
  currentExercises[idx].name = newName;
  renderExercises();
}

function groupSuperset() {
  const input = prompt("Enter exercise numbers to group as superset (comma separated, e.g. 1,3,5):");
  if (!input) return;

  const indices = input.split(',').map(n => parseInt(n.trim()) - 1).filter(n => !isNaN(n));
  if (indices.length < 2) return alert("Select at least 2 exercises");

  const groupId = Date.now();
  indices.forEach(i => currentExercises[i].supersetGroup = groupId);
  renderExercises();
}

function updateStats() {
  document.getElementById('calDisplay').textContent = caloriesBurned;
  document.getElementById('volDisplay').textContent = totalVolume;
}

function beep() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'square';
  osc.frequency.value = 800;
  gain.gain.value = 0.1;
  osc.start();
  setTimeout(() => osc.stop(), 150);
}

function startRest(sec) {
  clearInterval(restTimer);
  let t = sec;
  const disp = document.getElementById('restTimer');
  disp.textContent = t;

  restTimer = setInterval(() => {
    t--;
    disp.textContent = t;
    if (t <= 0) {
      clearInterval(restTimer);
      disp.textContent = "GO!";
      beep();
    }
  }, 1000);
}

function finishWorkout() {
  if (!currentExercises.length) return alert("No exercises logged.");
  alert(`Workout finished!\nDuration: ${document.getElementById('workoutTimer').textContent}\nCalories: ${caloriesBurned}\nVolume: ${totalVolume} lb`);
  // Save to history logic here (add your previous save code)
  currentExercises = [];
  caloriesBurned = 0;
  totalVolume = 0;
  clearInterval(timerInterval);
  document.getElementById('activeWorkout').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
}

function saveSettings() {
  bodyweight = parseInt(document.getElementById('bodyweightInput').value) || 200;
  localStorage.setItem('benge_bw', bodyweight);
  theme = document.getElementById('themeSelect').value;
  localStorage.setItem('benge_theme', theme);
  document.body.classList.toggle('light', theme === 'light');
  alert("Settings saved.");
}

function clearAllData() {
  if (confirm("Clear all history?")) {
    // add your clear logic
    alert("History cleared.");
  }
}

// Placeholder for exportHistory, showTab, etc. — add your previous implementations
function exportHistory() { alert("Export to CSV - implement your logic here"); }
</script>
</body>
</html>
