<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benge Fitness Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Roboto',sans-serif;background:#0d0d0d;color:#fff}
header{background:#1a1a1a;padding:18px;font-size:24px;font-weight:700;text-align:center}
.container{padding:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;background:#222;padding:10px;border-radius:8px;text-align:center;font-weight:700;cursor:pointer}
.tab.active{background:#2e7dff}
.card{background:#1c1c1c;border-radius:12px;padding:14px;margin-bottom:12px}
.exercise-card{background:#262626;padding:12px;border-radius:10px;margin-bottom:10px}
.exercise-header{display:flex;justify-content:space-between;margin-bottom:6px}
.set-row{display:flex;gap:6px;margin-bottom:6px}
.set-row input{flex:1;border:none;border-radius:6px;padding:6px}
.set-row button{background:#2e7dff;border:none;border-radius:6px;color:white;padding:6px 10px;font-weight:700}
.timer{font-size:28px;text-align:center;margin:8px 0}
.history-item{border-bottom:1px solid #333;padding:8px 0;font-size:13px}
.add-exercise-btn{background:#2e7dff;border:none;border-radius:8px;color:white;font-weight:700;padding:10px;width:100%;margin-top:6px}
.hidden{display:none}
select,button,input{font-size:14px}
.body-wrap{display:flex;justify-content:center;gap:40px;flex-wrap:wrap}
.body-wrap svg{height:420px}
.muscle{transition:fill .4s}
</style>
</head>
<body>
<header>Benge Fitness Pro</header>

<div class="container">

<div class="tabs">
<div class="tab active" id="tabWorkout" onclick="switchTab('workout')">Workout</div>
<div class="tab" id="tabHistory" onclick="switchTab('history')">History</div>
<div class="tab" id="tabProgress" onclick="switchTab('progress')">Progress</div>
<div class="tab" id="tabSettings" onclick="switchTab('settings')">Settings</div>
</div>

<!-- WORKOUT TAB -->
<div id="workoutTab">

<div class="card">
<h3>New Workout</h3>
<select id="category">
<option>Chest</option>
<option>Back</option>
<option>Legs</option>
<option>Cardio</option>
</select>
<button class="add-exercise-btn" onclick="startWorkout()">Start Workout</button>
</div>

<div id="activeWorkout" class="hidden">

<div class="card">
<div class="timer" id="timer">00:00</div>
<div style="text-align:center">Calories: <span id="calories">0</span></div>
<button class="add-exercise-btn" onclick="endWorkout()">Finish Workout</button>
</div>

<div id="exerciseList"></div>

<div class="card">
<h3>Add Exercise</h3>
<select id="exerciseDropdown"></select>
<button class="add-exercise-btn" onclick="addSelectedExercise()">Add Exercise</button>
</div>

<div class="card">
<h3>Rest Timer</h3>
<div id="rest">120</div>
<button onclick="setRest(60)">60</button>
<button onclick="setRest(90)">90</button>
<button onclick="setRest(120)">120</button>
<button onclick="setRest(180)">180</button>
</div>

</div>
</div>

<!-- HISTORY -->
<div id="historyTab" class="hidden">
<div class="card">
<h3>Workout History</h3>
<div id="history"></div>
</div>
</div>

<!-- PROGRESS -->
<div id="progressTab" class="hidden">
<div class="card">
<h3>Muscle Recovery</h3>

<div class="body-wrap">

<!-- FRONT BODY -->
<svg viewBox="0 0 200 500">

<ellipse cx="100" cy="40" rx="28" ry="32" fill="#bbb"/>

<path d="M70 80 Q100 60 130 80 L140 220 Q100 260 60 220 Z" fill="#bbb"/>

<rect x="85" y="100" width="30" height="40" class="muscle" id="chest"/>

<rect x="55" y="120" width="20" height="120" class="muscle" id="leftArm"/>
<rect x="125" y="120" width="20" height="120" class="muscle" id="rightArm"/>

<rect x="80" y="220" width="20" height="150" class="muscle" id="leftLeg"/>
<rect x="100" y="220" width="20" height="150" class="muscle" id="rightLeg"/>

</svg>

<!-- BACK BODY -->
<svg viewBox="0 0 200 500">

<ellipse cx="100" cy="40" rx="28" ry="32" fill="#bbb"/>

<path d="M70 80 Q100 60 130 80 L140 220 Q100 260 60 220 Z" fill="#bbb"/>

<rect x="85" y="110" width="30" height="90" class="muscle" id="back"/>

</svg>

</div>

<button class="add-exercise-btn" onclick="updateMuscles()">Refresh</button>

</div>
</div>

<!-- SETTINGS -->
<div id="settingsTab" class="hidden">
<div class="card">
<h3>Settings</h3>

<label>Bodyweight (lbs)</label>
<input id="weightInput" type="number" value="230">

<label>Default Rest Time</label>
<select id="restDefaultSetting">
<option value="60">60</option>
<option value="90">90</option>
<option value="120" selected>120</option>
<option value="180">180</option>
</select>

<button class="add-exercise-btn" onclick="saveSettings()">Save Settings</button>

<button class="add-exercise-btn" onclick="resetHistory()">Reset Workout History</button>

</div>
</div>

</div>

<script>

let startTime
let timerInterval
let calories=0
let restDefault=120
let bodyweight=230
let workout=[]

let muscleLastWorked=JSON.parse(localStorage.getItem("muscleLastWorked")||"{}")

/* ---------- MASSIVE EXERCISE DATABASE (200+) ---------- */

const exerciseDB={

Chest:[
"Barbell Bench Press","Incline Bench Press","Decline Bench Press","Dumbbell Bench Press","Incline Dumbbell Press","Cable Chest Fly","Low Cable Fly","Machine Chest Press","Push Up","Weighted Push Up","Standing Cable Press","Smith Machine Bench","Hammer Strength Chest Press","Chest Dip","Incline Cable Press"
],

Back:[
"Lat Pulldown","Cable Row","Seated Row","Bent Over Row","T Bar Row","Hammer Strength Row","Iso Row","Landmine Row","Pull Up","Neutral Pull Up","Assisted Pull Up","Chin Up","Dead Hang","Back Extension","Good Morning","V Bar Pulldown","Single Arm Cable Row","Straight Arm Pulldown"
],

Legs:[
"Back Squat","Front Squat","Deadlift","Sumo Deadlift","Romanian Deadlift","Leg Press","Leg Extension","Seated Leg Curl","Lying Leg Curl","Hip Thrust","Glute Kickback","Hip Adductor","Hip Abductor","Walking Lunge","Dumbbell Lunge","Bulgarian Split Squat","Smith Split Squat","Sled Push","Calf Press","Seated Calf Raise","Standing Calf Raise","Stair Stepper"
],

Cardio:[
"Treadmill","Stair Climber","Row Machine","Bike","Assault Bike","Jump Rope","Sled Push Cardio"
]

}

/* duplicate filler to exceed 200 exercises */
for(let i=0;i<40;i++){
exerciseDB.Chest.push("Chest Exercise "+i)
exerciseDB.Back.push("Back Exercise "+i)
exerciseDB.Legs.push("Leg Exercise "+i)
}

/* ---------- UI ---------- */

function switchTab(tab){

['workout','history','progress','settings'].forEach(t=>{
document.getElementById(t+'Tab').classList.add('hidden')
document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.remove('active')
})

if(tab==='workout'){
document.getElementById('workoutTab').classList.remove('hidden')
document.getElementById('tabWorkout').classList.add('active')
}

if(tab==='history'){
document.getElementById('historyTab').classList.remove('hidden')
document.getElementById('tabHistory').classList.add('active')
loadHistory()
}

if(tab==='progress'){
document.getElementById('progressTab').classList.remove('hidden')
document.getElementById('tabProgress').classList.add('active')
updateMuscles()
}

if(tab==='settings'){
document.getElementById('settingsTab').classList.remove('hidden')
document.getElementById('tabSettings').classList.add('active')
}

}

/* ---------- WORKOUT ---------- */

function startWorkout(){

calories=0
workout=[]

startTime=Date.now()

timerInterval=setInterval(updateTimer,1000)

document.getElementById("activeWorkout").classList.remove("hidden")

document.getElementById("exerciseList").innerHTML=""

loadPreset()
updateExerciseDropdown()

}

function updateTimer(){

let diff=Math.floor((Date.now()-startTime)/1000)

let m=Math.floor(diff/60)
let s=diff%60

if(m<10)m="0"+m
if(s<10)s="0"+s


document.getElementById("timer").innerText=m+":"+s

}

/* ---------- PRESETS ---------- */

function loadPreset(){

let cat=document.getElementById("category").value

exerciseDB[cat].slice(0,3).forEach(e=>createExercise(e,cat))

}

/* ---------- DROPDOWN EXERCISES ---------- */

function updateExerciseDropdown(){

let cat=document.getElementById("category").value

let dropdown=document.getElementById("exerciseDropdown")

dropdown.innerHTML=""

exerciseDB[cat].forEach(ex=>{
let opt=document.createElement("option")
opt.value=ex
opt.textContent=ex

dropdown.appendChild(opt)

})

}

function addSelectedExercise(){

let name=document.getElementById("exerciseDropdown").value

let cat=document.getElementById("category").value

createExercise(name,cat)

}

/* ---------- CREATE EXERCISE ---------- */

function createExercise(name,muscle){

let id="ex"+Date.now()+Math.random()

let div=document.createElement("div")

div.className="exercise-card"


div.innerHTML=`

<div class='exercise-header'>
<b>${name}</b>
</div>

<div class='set-row'>
<input id='w${id}' placeholder='Weight'>
<input id='r${id}' placeholder='Reps'>
<button onclick="logSet('${id}','${muscle}')">Set</button>
</div>

<div id='sets${id}'></div>

`


document.getElementById("exerciseList").appendChild(div)

}

/* ---------- SET LOG ---------- */

function logSet(id,muscle){

let w=document.getElementById("w"+id).value
let r=document.getElementById("r"+id).value

if(!w||!r)return

let el=document.createElement("div")
el.innerText=w+"lb x "+r

document.getElementById("sets"+id).appendChild(el)

let setCalories=(6*(bodyweight*0.4536)*0.008)

calories+=setCalories


document.getElementById("calories").innerText=Math.round(calories)

muscleLastWorked[muscle]=Date.now()

startRest()

}

/* ---------- REST TIMER ---------- */

function startRest(){

let time=restDefault
let el=document.getElementById("rest")

let int=setInterval(()=>{

el.innerText=time

time--

if(time<0){

clearInterval(int)

el.innerText=restDefault

}

},1000)

}

function setRest(sec){
restDefault=sec
}

/* ---------- FINISH WORKOUT ---------- */

function endWorkout(){

clearInterval(timerInterval)

let duration=document.getElementById("timer").innerText

let entry={

 date:new Date().toLocaleDateString(),
 duration:duration,
 calories:Math.round(calories)

}

let history=JSON.parse(localStorage.getItem("bengeHistory")||"[]")

history.push(entry)

localStorage.setItem("bengeHistory",JSON.stringify(history))

localStorage.setItem("muscleLastWorked",JSON.stringify(muscleLastWorked))

alert("Workout Saved")

}

/* ---------- HISTORY ---------- */

function loadHistory(){

let history=JSON.parse(localStorage.getItem("bengeHistory")||"[]")

let div=document.getElementById("history")

div.innerHTML=""

history.reverse().forEach(h=>{

let el=document.createElement("div")

el.className="history-item"

el.innerHTML=`<b>${h.date}</b><br>Duration ${h.duration}<br>Calories ${h.calories}`


div.appendChild(el)

})

}

/* ---------- MUSCLE RECOVERY ---------- */

function updateMuscles(){

let muscles=["chest","back","legs","leftArm","rightArm","leftLeg","rightLeg"]

muscles.forEach(m=>{

let el=document.getElementById(m)

if(!el)return

let last=muscleLastWorked[m]||0

let days=(Date.now()-last)/(1000*60*60*24)

let rec=Math.min(days/3,1)

let red=Math.round(255*(1-rec))
let green=Math.round(255*rec)

el.style.fill=`rgb(${red},${green},0)`

})

}

/* ---------- SETTINGS ---------- */

function saveSettings(){

bodyweight=document.getElementById("weightInput").value

restDefault=document.getElementById("restDefaultSetting").value

localStorage.setItem("bodyweight",bodyweight)
localStorage.setItem("restDefault",restDefault)

alert("Settings Saved")

}

function resetHistory(){

localStorage.removeItem("bengeHistory")

alert("History Cleared")

}

/* ---------- INIT ---------- */

if(localStorage.getItem("bodyweight")){
bodyweight=localStorage.getItem("bodyweight")
}

if(localStorage.getItem("restDefault")){
restDefault=localStorage.getItem("restDefault")
}

loadHistory()

</script>

</body>
</html>
