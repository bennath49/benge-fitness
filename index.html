<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benge Fitness Pro</title>

<style>

body{
font-family:Arial;
background:#121212;
color:white;
margin:0;
padding:20px;
}

h1{
text-align:center;
}

button{
padding:10px 15px;
margin:5px;
border:none;
border-radius:6px;
background:#ff7a18;
color:white;
cursor:pointer;
}

.container{
max-width:1000px;
margin:auto;
}

.exercise-card{
border:1px solid #333;
border-radius:10px;
padding:10px;
margin:10px 0;
display:flex;
gap:15px;
align-items:center;
}

.exercise-card img{
width:120px;
border-radius:8px;
}

.draggable{
cursor:grab;
}

.dragging{
opacity:.4;
}

.drop-target{
border:2px dashed orange;
}

.set{
display:flex;
gap:10px;
margin:5px 0;
}

input{
width:60px;
}

.muscle-map{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:20px;
}

.muscle{
height:60px;
border-radius:6px;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
}

.timer{
font-size:30px;
margin-top:20px;
text-align:center;
}

</style>
</head>

<body>

<div class="container">

<h1>Benge Fitness Pro</h1>

<button onclick="startWorkout()">Start Workout</button>
<button onclick="buildAIWorkout()">AI Workout Builder</button>
<button onclick="saveWorkout()">Finish Workout</button>

<div style="margin-top:10px;">
<select id="categorySelect">
<option>Chest</option>
<option>Back</option>
<option>Legs</option>
<option>Cardio</option>
</select>

<button onclick="addExercisePrompt()">Add Exercise</button>
</div>

<div id="exerciseList"></div>

<div class="timer">
<div id="timerDisplay">02:00</div>
<button onclick="startTimer()">Start Rest Timer</button>
</div>

<h2>Muscle Fatigue</h2>

<div class="muscle-map" id="muscleMap"></div>

<h2>Workout History</h2>
<div id="history"></div>

</div>

<script>

const userWeight = 230;

let currentExercises=[];
let history=JSON.parse(localStorage.getItem("workouts")||"[]");

const EXERCISES={
Chest:[
{name:"Barbell Bench Press",muscle:"pectorals"},
{name:"Dumbbell Press",muscle:"pectorals"}
],
Back:[
{name:"Lat Pulldown",muscle:"lats"},
{name:"Deadlift",muscle:"hamstrings"}
],
Legs:[
{name:"Back Squat",muscle:"quads"},
{name:"Lunge",muscle:"glutes"}
],
Cardio:[
{name:"Running",muscle:"calves"},
{name:"Row Machine",muscle:"lats"}
]
};

const EXERCISE_MEDIA={
"Barbell Bench Press":{
img:"https://fitnessprogramer.com/wp-content/uploads/2021/02/Barbell-Bench-Press.gif"
},
"Lat Pulldown":{
img:"https://fitnessprogramer.com/wp-content/uploads/2021/02/Lat-Pulldown.gif"
},
"Back Squat":{
img:"https://fitnessprogramer.com/wp-content/uploads/2021/02/Barbell-Squat.gif"
},
"Deadlift":{
img:"https://fitnessprogramer.com/wp-content/uploads/2021/02/Barbell-Deadlift.gif"
}
};

const TRAINING_SPLIT={
Monday:"Chest",
Tuesday:"Legs",
Wednesday:"Cardio",
Thursday:"Back",
Friday:"Chest",
Saturday:"Cardio",
Sunday:"Rest"
};

function startWorkout(){

currentExercises=[];

const today=new Date().toLocaleDateString('en-US',{weekday:'long'});

const suggested=TRAINING_SPLIT[today];

if(suggested && suggested!=="Rest"){
document.getElementById("categorySelect").value=suggested;
}

renderExercises();

}

function addExercisePrompt(){

const cat=document.getElementById("categorySelect").value;

const list=EXERCISES[cat];

const name=prompt("Choose exercise:\n"+list.map(e=>e.name).join("\n"));

const ex=list.find(e=>e.name===name);

if(ex){
addExercise(ex.name,ex.muscle);
}

}

function addExercise(name,muscle){

currentExercises.push({
name,
muscle,
sets:[{weight:0,reps:0}],
supersetGroup:null
});

renderExercises();

}

function renderExercises(){

const container=document.getElementById("exerciseList");

container.innerHTML="";

currentExercises.forEach((ex,i)=>{

let media=EXERCISE_MEDIA[ex.name];

let visual=media
? `<img src="${media.img}">`
: `<div style="width:120px;height:120px;background:#333;display:flex;align-items:center;justify-content:center">${ex.muscle}</div>`;

let setsHTML="";

ex.sets.forEach((s,si)=>{

setsHTML+=`
<div class="set">
<input type="number" value="${s.weight}" onchange="updateSet(${i},${si},'weight',this.value)">
<input type="number" value="${s.reps}" onchange="updateSet(${i},${si},'reps',this.value)">
</div>
`;

});

const card=document.createElement("div");

card.className="exercise-card draggable";

card.dataset.index=i;

card.draggable=true;

card.addEventListener("dragstart",dragStart);
card.addEventListener("dragover",dragOver);
card.addEventListener("drop",dropExercise);

card.innerHTML=`
${visual}
<div>
<b>${ex.name}</b>
${setsHTML}
<button onclick="addSet(${i})">Add Set</button>
</div>
`;

container.appendChild(card);

});

updateMuscleMap();

}

function addSet(i){

currentExercises[i].sets.push({weight:0,reps:0});

renderExercises();

}

function updateSet(i,si,type,val){

currentExercises[i].sets[si][type]=Number(val);

}

let draggedIndex=null;

function dragStart(e){

draggedIndex=e.target.dataset.index;

}

function dragOver(e){

e.preventDefault();

}

function dropExercise(e){

const targetIndex=e.currentTarget.dataset.index;

const group=Date.now();

currentExercises[draggedIndex].supersetGroup=group;

currentExercises[targetIndex].supersetGroup=group;

renderExercises();

}

function calculateFatigue(muscle){

let fatigue=0;

history.forEach(w=>{

w.exercises.forEach(ex=>{

if(ex.muscle===muscle){

ex.sets.forEach(s=>{
fatigue+=s.weight*s.reps*0.01;
});

}

});

});

return Math.min(100,fatigue);

}

function updateMuscleMap(){

const muscles=[
"pectorals",
"lats",
"delts",
"biceps",
"triceps",
"quads",
"hamstrings",
"glutes",
"calves",
"abs"
];

const map=document.getElementById("muscleMap");

map.innerHTML="";

muscles.forEach(m=>{

const fatigue=calculateFatigue(m);

const freshness=100-fatigue;

const div=document.createElement("div");

div.className="muscle";

div.style.background=`rgba(255,0,0,${fatigue/100})`;

div.innerText=m;

map.appendChild(div);

});

}

function buildAIWorkout(){

const cat=document.getElementById("categorySelect").value;

const pool=EXERCISES[cat];

const scored=pool.map(ex=>{

return{
...ex,
fatigue:calculateFatigue(ex.muscle)
};

});

scored.sort((a,b)=>a.fatigue-b.fatigue);

const selected=scored.slice(0,4);

selected.forEach(ex=>addExercise(ex.name,ex.muscle));

}

function saveWorkout(){

const workout={
date:new Date(),
exercises:currentExercises
};

history.push(workout);

localStorage.setItem("workouts",JSON.stringify(history));

renderHistory();

alert("Workout saved");

}

function renderHistory(){

const h=document.getElementById("history");

h.innerHTML="";

history.slice().reverse().forEach(w=>{

const div=document.createElement("div");

div.innerHTML=`<b>${new Date(w.date).toLocaleDateString()}</b> — ${w.exercises.length} exercises`;

h.appendChild(div);

});

}

let timer=120;
let interval;

function startTimer(){

clearInterval(interval);

timer=120;

interval=setInterval(()=>{

timer--;

let m=Math.floor(timer/60);
let s=timer%60;

document.getElementById("timerDisplay").innerText=
`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

if(timer<=0)clearInterval(interval);

},1000);

}

renderHistory();

updateMuscleMap();

</script>

</body>
</html>
