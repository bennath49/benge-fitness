<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Benge Fitness Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #121212;
      --accent: #0066ff;
      --accent-dark: #004ccc;
      --success: #28a745;
      --danger: #ff4444;
      --text: #e0e0e0;
      --superset: #ff6b6b33;
      --light-bg: #f0f0f0;
      --light-card: #ffffff;
      --light-text: #0a0a0a;
    }
    body.light {
      --bg: var(--light-bg);
      --card: var(--light-card);
      --text: var(--light-text);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    header {
      background: #111;
      padding: 1.1rem;
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      border-bottom: 1px solid #222;
    }
    body.light header { background: #ddd; border-bottom: 1px solid #ccc; }
    .container { max-width: 680px; margin: 0 auto; padding: 1rem; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin: 1.2rem 0;
    }
    .tab {
      padding: 1rem;
      background: #1e1e1e;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
    }
    body.light .tab { background: #ddd; }
    .tab.active {
      background: var(--accent);
      color: white;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.3rem;
      margin-bottom: 1.3rem;
      border: 1px solid #222;
    }
    body.light .card { border: 1px solid #ccc; }
    button, select, input {
      padding: 0.8rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }
    select, input { background: #1e1e1e; color: white; width: 100%; margin: 0.5rem 0; }
    body.light select, body.light input { background: #f0f0f0; color: black; }
    button { background: var(--accent); color: white; cursor: pointer; }
    button:hover { background: var(--accent-dark); }
    .success-btn { background: var(--success); }
    .success-btn:hover { background: #218838; }
    .danger-btn { background: var(--danger); padding: 0.5rem 1rem; font-size: 0.9rem; }
    .exercise-card {
      background: #181818;
      border-radius: 10px;
      padding: 1.1rem;
      margin-bottom: 1.2rem;
      border: 1px solid #282828;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    body.light .exercise-card { background: #e8e8e8; border: 1px solid #ccc; }
    .superset-group { background: var(--superset); border-left: 4px solid #ff6b6b; padding-left: 1rem; margin: 0.8rem 0; border-radius: 6px; }
    .exercise-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.7rem; }
    .video-link { color: #4da6ff; cursor: pointer; font-size: 0.95rem; text-decoration: underline; }
    .set-row { display: grid; grid-template-columns: 1fr 1fr auto 120px; gap: 0.6rem; margin: 0.6rem 0; align-items: center; }
    .set-row input { text-align: center; }
    .sets-log div { margin: 0.4rem 0; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
    .timer { font-size: 3.2rem; font-weight: bold; text-align: center; margin: 1rem 0; letter-spacing: 2px; }
    .rest-display { font-size: 2.8rem; text-align: center; margin: 1rem 0; font-weight: 600; }
    .history-item { padding: 1.1rem 0; border-bottom: 1px solid #222; }
    body.light .history-item { border-bottom: 1px solid #ccc; }
    .hidden { display: none !important; }
    .reorder-btn { background: none; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; }
    .exercise-left { width: 120px; flex-shrink: 0; }
    .muscle-img { width: 100%; height: 120px; background: #2c2c2c; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: #888; }
    body.light .muscle-img { background: #ddd; color: #555; }
    .exercise-right { flex: 1; }
    .arrow-connector {
      position: absolute;
      left: 50%;
      top: 100%;
      width: 2px;
      height: 30px;
      background: #ff6b6b;
      transform: translateX(-50%);
    }
    .arrow-connector::after {
      content: '↓';
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff6b6b;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

<header>Benge Fitness Pro</header>

<div class="container">

  <div class="tabs">
    <div class="tab active" onclick="showTab('workout')">Workout</div>
    <div class="tab" onclick="showTab('history')">History</div>
    <div class="tab" onclick="showTab('progress')">Progress</div>
    <div class="tab" onclick="showTab('settings')">Settings</div>
  </div>

  <!-- WORKOUT TAB -->
  <div id="workoutTab">
    <div class="card" id="startScreen">
      <h3>Start New Workout</h3>
      <select id="categorySelect">
        <option value="Chest">Chest</option>
        <option value="Back">Back</option>
        <option value="Legs">Legs</option>
        <option value="Cardio">Cardio</option>
      </select>
      <button class="success-btn" style="width:100%;margin-top:1rem;font-size:1.1rem;" onclick="startNewWorkout()">Begin</button>
    </div>

    <div id="activeWorkout" class="hidden">
      <div class="card">
        <div class="timer" id="workoutTimer">00:00</div>
        <div style="text-align:center; margin:0.6rem 0; font-size:1.1rem;">
          Calories (est): <b id="calDisplay">0</b> kcal<br>
          Total Volume: <b id="volDisplay">0</b> lb
        </div>
        <button onclick="finishWorkout()" style="width:100%;font-size:1.1rem;">Finish & Save</button>
      </div>

      <div id="exercisesContainer"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin:1.2rem 0;">
        <button class="success-btn" onclick="addExercisePrompt()">+ Add Exercise</button>
        <button onclick="groupSuperset()">Group Superset</button>
      </div>

      <div class="card">
        <h3>Rest Timer</h3>
        <div class="rest-display" id="restTimer">—</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0.6rem;">
          <button onclick="startRest(60)">60s</button>
          <button onclick="startRest(90)">90s</button>
          <button onclick="startRest(120)">120s</button>
          <button onclick="startRest(180)">180s</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HISTORY TAB -->
  <div id="historyTab" class="hidden">
    <div class="card">
      <h3>Workout History</h3>
      <button onclick="exportHistory()" style="width:100%;margin-bottom:1rem;">Export to CSV</button>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- PROGRESS TAB -->
  <div id="progressTab" class="hidden">
    <div class="card">
      <h3>Body Progress Map</h3>
      <div class="body-diagram">
        <svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
          <!-- Simple body outline -->
          <rect x="80" y="20" width="40" height="40" rx="20" fill="#aaa" /> <!-- Head -->
          <rect x="60" y="60" width="80" height="150" rx="20" fill="#aaa" /> <!-- Torso -->
          <rect x="40" y="60" width="20" height="100" rx="10" fill="#aaa" class="muscle" id="left-arm" /> <!-- Left Arm -->
          <rect x="140" y="60" width="20" height="100" rx="10" fill="#aaa" class="muscle" id="right-arm" /> <!-- Right Arm -->
          <rect x="60" y="210" width="40" height="150" rx="10" fill="#aaa" class="muscle" id="left-leg" /> <!-- Left Leg -->
          <rect x="100" y="210" width="40" height="150" rx="10" fill="#aaa" class="muscle" id="right-leg" /> <!-- Right Leg -->
          <rect x="80" y="80" width="40" height="80" rx="10" fill="#aaa" class="muscle" id="chest" /> <!-- Chest -->
          <rect x="80" y="160" width="40" height="50" rx="10" fill="#aaa" class="muscle" id="abs" /> <!-- Abs -->
        </svg>
        <div id="sorenessInputs">
          <!-- Inputs for soreness % -->
        </div>
      </div>
    </div>
  </div>

  <!-- SETTINGS TAB -->
  <div id="settingsTab" class="hidden">
    <div class="card">
      <h3>Settings</h3>
      <label>Bodyweight (lb):</label>
      <input type="number" id="bodyweightInput" value="200">
      <div style="margin:1rem 0;">
        <label>Theme:</label>
        <select id="themeSelect">
          <option value="dark">Dark Mode</option>
          <option value="light">Light Mode</option>
        </select>
      </div>
      <button style="width:100%;margin-top:1rem;" onclick="saveSettings()">Save</button>
      <button class="danger-btn" style="width:100%;margin-top:1.5rem;" onclick="clearAllData()">Clear All History</button>
    </div>
  </div>

</div>

<script>
// ──────────────────────────────────────────────── DATA ────────────────────────────────────────────────
const EXERCISES = {
  Chest: [
    "Wall Pectoral Stretch", "Chest Doorway Stretch", "Barbell Bench Press", "Hammer Curls",
    "Barbell Decline Bench Press", "Dumbbell Bicep Curl", "Barbell Incline Bench Press",
    "Incline Bench Press", "Incline Dumbbell Curl", "Standing Incline Cable Chest Press",
    "Standing Low Cable Chest Fly", "Preacher Curl", "Dumbbell Tricep Extension",
    "Barbell Shoulder Press", "Cable Rope Overhead Triceps Extension", "Cable Face Pull",
    "Cable Tricep Pushdown", "Cable Bicep Curl", "Tricep Stretch", "Dumbbell Kickbacks",
    "Dumbbell Tricep Extension", "Skullcrusher", "Assisted Dip", "Cable One Arm Tricep Side Extension"
  ],
  Back: [
    "Cable Row", "Dumbbell Lateral Raises", "Lat Pulldown", "Seated Back Extension",
    "Assisted Chin Up", "V-Bar Pulldown", "Machine Shoulder Shrug", "Stiff Leg Barbell Good Morning",
    "Smith Machine Upright Row", "Hammer Strength High Row", "Hammer Strength Iso Row",
    "Pull Up", "Landmine Row", "Neutral Grip Pull Up", "Dead Hang", "Foam Roll Upper Back",
    "Foam Roll Lats", "Treadmill"
  ],
  Legs: [
    "Stair Stepper", "Deadlift", "Back Squat", "Machine Hip Adductor", "Machine Hip Abductor",
    "Glute Kickback Machine", "Leg Extension", "Seated Leg Curl", "Dorsiflexion Machine",
    "Barbell Hip Thrust", "Calf Press", "Seated Machine Calf Press", "Leg Press", "Sled Push",
    "Sumo Deadlift", "Smith Machine Single Leg Split Squat", "Dumbbell Lunge", "Treadmill"
  ],
  Cardio: [
    "Treadmill", "Stairs"
  ]
};

const MUSCLE_ALTERNATIVES = {
  chest: [
    "Barbell Bench Press", "Incline Bench Press", "Decline Bench Press", "Cable Chest Fly", "Dumbbell Chest Press", "Push-Ups", "Machine Chest Press", "Pec Deck Fly", "Dips (Chest Focus)", "Cable Crossover"
  ],
  back: [
    "Lat Pulldown", "Seated Cable Row", "Pull-Up", "Bent-Over Barbell Row", "Deadlift", "T-Bar Row", "Face Pull", "Hammer Strength Row", "Landmine Row", "Inverted Row"
  ],
  legs: [
    "Back Squat", "Leg Press", "Romanian Deadlift", "Walking Lunges", "Leg Extension", "Seated Leg Curl", "Hip Thrust", "Calf Raise", "Sumo Deadlift", "Bulgarian Split Squat"
  ],
  arms: [
    "Barbell Curl", "Hammer Curl", "Tricep Pushdown", "Overhead Tricep Extension", "Skullcrusher", "Preacher Curl", "Concentration Curl", "Tricep Kickback", "Close-Grip Bench", "Chin-Up"
  ],
  shoulders: [
    "Overhead Press", "Lateral Raise", "Front Raise", "Upright Row", "Arnold Press", "Rear Delt Fly", "Shrug", "Cable Lateral Raise", "Military Press", "Face Pull"
  ],
  cardio: [
    "Treadmill", "Stair Climber", "Elliptical", "Rowing Machine", "Cycling Bike", "Jump Rope", "Running in Place", "High Knees", "Burpees", "Mountain Climbers"
  ]
};

let workoutStartTime, timerInterval, restInterval;
let currentExercises = [];
let caloriesBurned = 0;
let totalVolume = 0;
let bodyweight = parseInt(localStorage.getItem('benge_bw')) || 200;
let history = JSON.parse(localStorage.getItem('benge_history') || '[]');
let theme = localStorage.getItem('benge_theme') || 'dark';
let muscleSoreness = JSON.parse(localStorage.getItem('benge_soreness') || '{}');

document.body.classList.toggle('light', theme === 'light');
document.getElementById('bodyweightInput').value = bodyweight;
document.getElementById('themeSelect').value = theme;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// ──────────────────────────────────────────────── UI FUNCTIONS ────────────────────────────────────────────────
function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');

  document.getElementById('workoutTab').classList.toggle('hidden', tab !== 'workout');
  document.getElementById('historyTab').classList.toggle('hidden', tab !== 'history');
  document.getElementById('progressTab').classList.toggle('hidden', tab !== 'progress');
  document.getElementById('settingsTab').classList.toggle('hidden', tab !== 'settings');

  if (tab === 'history') loadHistory();
  if (tab === 'progress') loadBodyDiagram();
}

function startNewWorkout() {
  currentExercises = [];
  caloriesBurned = 0;
  totalVolume = 0;
  workoutStartTime = Date.now();

  clearInterval(timerInterval);
  timerInterval = setInterval(updateWorkoutTimer, 1000);

  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('activeWorkout').classList.remove('hidden');

  loadPresetExercises();
  renderExercises();
  updateStats();
}

function updateWorkoutTimer() {
  let sec = Math.floor((Date.now() - workoutStartTime) / 1000);
  let m = Math.floor(sec / 60).toString().padStart(2,'0');
  let s = (sec % 60).toString().padStart(2,'0');
  document.getElementById('workoutTimer').textContent = `${m}:${s}`;
}

function loadPresetExercises() {
  const cat = document.getElementById('categorySelect').value;
  EXERCISES[cat].forEach(name => addExercise(name));
}

function addExercise(name) {
  currentExercises.push({
    name,
    sets: [],
    supersetGroup: null
  });
  renderExercises();
}

function addExercisePrompt() {
  const select = document.createElement('select');
  Object.values(EXERCISES).flat().forEach(name => {
    const opt = document.createElement('option');
    opt.text = name;
    select.add(opt);
  });
  const popup = document.createElement('div');
  popup.style.position = 'fixed';
  popup.style.top = '50%';
  popup.style.left = '50%';
  popup.style.transform = 'translate(-50%, -50%)';
  popup.style.background = 'var(--card)';
  popup.style.padding = '1rem';
  popup.style.borderRadius = '10px';
  popup.style.border = '1px solid var(--accent)';
  popup.innerHTML = `<h3>Select Exercise</h3>${select.outerHTML}<br><button onclick="addExercise(this.previousSibling.value);this.parentElement.remove()">Add</button><button onclick="this.parentElement.remove()">Cancel</button>`;
  document.body.appendChild(popup);
}

function groupSuperset() {
  renderExercises(true); // with checkboxes
}

function renderExercises(withChecks = false) {
  const container = document.getElementById('exercisesContainer');
  container.innerHTML = '';

  let currentGroup = null;

  currentExercises.forEach((ex, i) => {
    if (ex.supersetGroup !== currentGroup) {
      if (currentGroup !== null) container.innerHTML += '</div>';
      if (ex.supersetGroup !== null) {
        container.innerHTML += '<div class="superset-group">';
        currentGroup = ex.supersetGroup;
      } else {
        currentGroup = null;
      }
    }

    let card = document.createElement('div');
    card.className = 'exercise-card';
    card.innerHTML = `
      <div class="exercise-header">
        <strong>${ex.name}</strong>
        <div>
          <button class="reorder-btn" onclick="moveExercise(${i}, -1)">↑</button>
          <button class="reorder-btn" onclick="moveExercise(${i}, 1)">↓</button>
        </div>
      </div>
      <div class="set-row">
        <input type="number" placeholder="Weight" id="w_${i}">
        <input type="number" placeholder="Reps" id="r_${i}">
        <button onclick="logSet(${i})">Log</button>
        <span id="rest_${i}" class="rest-display" style="display:none;">—</span>
      </div>
      <div id="sets_${i}"></div>
      <div style="margin-top:0.8rem;display:flex;gap:0.6rem;">
        <button class="danger-btn" onclick="removeExercise(${i})">Remove</button>
        <button onclick="showReplaceOptions(${i})">Replace</button>
        ${withChecks ? `<input type="checkbox" class="select-check" data-idx="${i}"> Select` : ''}
      </div>
    `;
    container.appendChild(card);

    ex.sets.forEach((s, si) => {
      let setDiv = document.createElement('div');
      setDiv.innerHTML = `${s.weight || 'BW'} × ${s.reps} <button class="danger-btn" onclick="removeSet(${i},${si})">×</button>`;
      document.getElementById(`sets_${i}`).appendChild(setDiv);
    });

    if (ex.supersetGroup !== null && i < currentExercises.length - 1 && currentExercises[i+1].supersetGroup === ex.supersetGroup) {
      container.innerHTML += '<div class="arrow-connector"></div>';
    }
  });

  if (currentGroup !== null) container.innerHTML += '</div>';

  if (withChecks) {
    const btn = document.createElement('button');
    btn.textContent = 'Group Selected as Superset';
    btn.onclick = () => {
      const selected = [];
      document.querySelectorAll('.select-check:checked').forEach(check => selected.push(parseInt(check.dataset.idx)));
      if (selected.length < 2) return alert("Select at least 2 exercises");
      const groupId = Date.now();
      selected.forEach(idx => currentExercises[idx].supersetGroup = groupId);
      renderExercises();
    };
    container.appendChild(btn);
  }
}

function logSet(idx) {
  const w = parseFloat(document.getElementById(`w_${idx}`).value) || 0;
  const r = parseInt(document.getElementById(`r_${idx}`).value);

  if (!r || r < 1) return alert("Enter valid reps");

  currentExercises[idx].sets.push({weight: w, reps: r});

  caloriesBurned += Math.round(5 + (bodyweight * 0.1) + (r * 2));
  totalVolume += w * r;

  updateStats();
  renderExercises();

  document.getElementById(`rest_${idx}`).style.display = 'block';
  startRest(120, idx); // auto-start 2 min timer next to this exercise
}

function startRest(seconds, exerciseIdx) {
  let time = seconds;
  const disp = document.getElementById(`rest_${exerciseIdx}`);
  disp.textContent = time;

  const intv = setInterval(() => {
    time--;
    disp.textContent = time;
    if (time <= 0) {
      clearInterval(intv);
      disp.textContent = "GO!";
      beep();
    }
  }, 1000);
}

function removeExercise(idx) {
  if (confirm("Remove exercise?")) {
    currentExercises.splice(idx, 1);
    renderExercises();
  }
}

function removeSet(exIdx, setIdx) {
  if (confirm("Delete set?")) {
    currentExercises[exIdx].sets.splice(setIdx, 1);
    renderExercises();
  }
}

function moveExercise(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= currentExercises.length) return;
  [currentExercises[idx], currentExercises[newIdx]] = [currentExercises[newIdx], currentExercises[idx]];
  renderExercises();
}

function showReplaceOptions(idx) {
  const muscle = 'chest'; // Placeholder - determine based on exercise name as in previous code
  const alts = MUSCLE_ALTERNATIVES[muscle] || [];
  if (!alts.length) return alert("No replacements found");

  let html = '<h4>Replace with:</h4><ul>';
  alts.forEach(opt => html += `<li><button onclick="replaceExercise(${idx}, '${opt}')">${opt}</button></li>`);
  html += '</ul>';

  const popup = document.createElement('div');
  popup.style.position = 'fixed';
  popup.style.top = '50%';
  popup.style.left = '50%';
  popup.style.transform = 'translate(-50%, -50%)';
  popup.style.background = 'var(--card)';
  popup.style.padding = '1rem';
  popup.style.borderRadius = '10px';
  popup.style.border = '1px solid var(--accent)';
  popup.innerHTML = html + '<button onclick="this.parentElement.remove()">Close</button>';
  document.body.appendChild(popup);
}

function replaceExercise(idx, newName) {
  currentExercises[idx].name = newName;
  renderExercises();
}

function beep() {
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  oscillator.type = 'square';
  oscillator.frequency.value = 800;
  gainNode.gain.value = 0.1;
  oscillator.start();
  setTimeout(() => oscillator.stop(), 150);
}

function finishWorkout() {
  if (currentExercises.length === 0) return alert("No exercises logged.");

  const duration = document.getElementById('workoutTimer').textContent;
  const entry = {
    date: new Date().toLocaleString(),
    duration,
    calories: caloriesBurned,
    volume: totalVolume,
    exercises: currentExercises.map(ex => ({
      name: ex.name,
      sets: ex.sets
    }))
  };

  history.push(entry);
  localStorage.setItem('benge_history', JSON.stringify(history));

  alert(`Saved!\n${duration} • ${caloriesBurned} kcal • ${totalVolume} lb`);

  currentExercises = [];
  caloriesBurned = 0;
  totalVolume = 0;
  clearInterval(timerInterval);
  document.getElementById('activeWorkout').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
}

function updateStats() {
  document.getElementById('calDisplay').textContent = caloriesBurned;
  document.getElementById('volDisplay').textContent = totalVolume;
}

</script>
</body>
</html>
