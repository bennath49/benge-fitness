<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Benge Fitness Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #121212;
      --accent: #0066ff;
      --accent-dark: #004ccc;
      --success: #28a745;
      --danger: #ff4444;
      --text: #e0e0e0;
      --superset: #ff6b6b33;
      --light-bg: #f8f9fa;
      --light-card: #ffffff;
      --light-text: #212529;
    }
    body.light {
      --bg: var(--light-bg);
      --card: var(--light-card);
      --text: var(--light-text);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    header {
      background: #111;
      padding: 1.2rem;
      font-size: 1.7rem;
      font-weight: 700;
      text-align: center;
      border-bottom: 1px solid #222;
    }
    body.light header { background: #e9ecef; color: #212529; border-bottom: 1px solid #dee2e6; }
    .container { max-width: 760px; margin: 0 auto; padding: 1rem; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin: 1.2rem 0;
    }
    .tab {
      padding: 1rem;
      background: #1e1e1e;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    body.light .tab { background: #dee2e6; }
    .tab.active { background: var(--accent); color: white; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.4rem;
      margin-bottom: 1.4rem;
      border: 1px solid #222;
    }
    body.light .card { border: 1px solid #ced4da; }
    button, select, input {
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }
    select, input { background: #1e1e1e; color: white; width: 100%; margin: 0.5rem 0; }
    body.light select, body.light input { background: #f1f3f5; color: #212529; }
    button { background: var(--accent); color: white; cursor: pointer; transition: 0.2s; }
    button:hover { background: var(--accent-dark); }
    .success-btn { background: var(--success); }
    .success-btn:hover { background: #218838; }
    .danger-btn { background: var(--danger); font-size: 0.9rem; padding: 0.6rem 1rem; }
    .exercise-container { display: flex; gap: 1.2rem; margin-bottom: 1.2rem; position: relative; }
    .muscle-visual {
      width: 130px;
      height: 130px;
      background: #2c2c2c;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: #888;
      flex-shrink: 0;
    }
    body.light .muscle-visual { background: #e9ecef; color: #495057; }
    .exercise-card {
      flex: 1;
      background: #181818;
      border-radius: 10px;
      padding: 1.2rem;
      border: 1px solid #282828;
    }
    body.light .exercise-card { background: #f8f9fa; border: 1px solid #ced4da; }
    .superset-group {
      background: var(--superset);
      padding: 1.2rem;
      border-radius: 10px;
      margin: 1.2rem 0;
      position: relative;
    }
    .arrow-line {
      position: absolute;
      left: 50%;
      top: 100%;
      width: 3px;
      height: 50px;
      background: #ff6b6b;
      transform: translateX(-50%);
    }
    .arrow-line::after {
      content: '↓';
      position: absolute;
      bottom: -24px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff6b6b;
      font-size: 1.8rem;
      font-weight: bold;
    }
    .timer-area { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; }
    .main-timer { font-size: 3.5rem; font-weight: bold; letter-spacing: 3px; }
    .stats-box { font-size: 1.1rem; text-align: right; line-height: 1.6; }
    .rest-display { font-size: 3rem; text-align: center; margin: 1rem 0; font-weight: 600; color: #ff6b6b; }
    .history-item { padding: 1.2rem 0; border-bottom: 1px solid #222; }
    body.light .history-item { border-bottom: 1px solid #dee2e6; }
    .hidden { display: none !important; }
    .progress-chart { height: 320px; margin: 1rem 0; }
    .reorder-btn { background: none; border: none; color: var(--text); font-size: 1.4rem; cursor: pointer; padding: 0 0.5rem; }
    .set-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 0.8rem; margin: 0.8rem 0; align-items: center; }
    .sets-log div { margin: 0.5rem 0; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
    .body-diagram { display: flex; gap: 2rem; justify-content: center; margin: 1.5rem 0; }
    .body-diagram div { text-align: center; }
    .body-diagram svg { width: 200px; height: 400px; }
    .muscle { fill: #ddd; }
    body.light .muscle { fill: #aaa; }
    .muscle-sore { fill: red; }
    .muscle-fresh { fill: green; }
  /* Realistic Muscle Diagram Styling */
    .realistic-muscle-map svg path {
      transition: fill 0.3s ease;
      stroke: none; /* remove original outline */
    }

    /* Green for Fresh */
    .realistic-muscle-map .muscle-fresh path {
      fill: #28a745 !important;
    }

    /* Red for Fatigued */
    .realistic-muscle-map .muscle-sore path {
      fill: #ff4444 !important;
    }
  </style>
</head>
<body>

<header>Benge Fitness Pro</header>

<div class="container">

  <div class="tabs">
    <div class="tab active" onclick="showTab('workout')">Workout</div>
    <div class="tab" onclick="showTab('history')">History</div>
    <div class="tab" onclick="showTab('progress')">Progress</div>
    <div class="tab" onclick="showTab('settings')">Settings</div>
  </div>

  <!-- WORKOUT TAB -->
  <div id="workoutTab">
    <div class="card" id="startScreen">
      <h3>Start New Workout</h3>
      <select id="categorySelect">
        <option value="Chest">Chest</option>
        <option value="Back">Back</option>
        <option value="Legs">Legs</option>
        <option value="Cardio">Cardio</option>
      </select>
      <button class="success-btn" style="width:100%;margin-top:1rem;font-size:1.1rem;" onclick="startNewWorkout()">Begin</button>
    </div>

    <div id="activeWorkout" class="hidden">
      <div class="card timer-area">
        <div>
          <div class="main-timer" id="workoutTimer">00:00</div>
        </div>
        <div class="stats-box">
          Calories (est): <b id="calDisplay">0</b> kcal<br>
          Volume: <b id="volDisplay">0</b> lb<br><br>
          <button onclick="finishWorkout()" style="font-size:1.1rem;padding:0.8rem 1.8rem;">Finish & Save</button>
        </div>
      </div>

      <div id="exercisesContainer"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin:1.4rem 0;">
        <button class="success-btn" onclick="addExercisePrompt()">+ Add Exercise</button>
        <button onclick="groupSuperset()">Group Superset</button>
      </div>

      <div class="card">
        <h3>Rest Timer</h3>
        <div class="rest-display" id="restTimer">—</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0.6rem;">
          <button onclick="startRest(60)">60s</button>
          <button onclick="startRest(90)">90s</button>
          <button onclick="startRest(120)">120s</button>
          <button onclick="startRest(180)">180s</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HISTORY TAB -->
  <div id="historyTab" class="hidden">
    <div class="card">
      <h3>Workout History</h3>
      <button onclick="exportHistory()" style="margin-bottom:1rem;width:100%;">Export to CSV</button>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- PROGRESS TAB -->
  <div id="progressTab" class="hidden">
    <div class="card">
      <h3>Progress Tracking</h3>
      <div style="margin:1.5rem 0;">
        <h4>Total Volume (lb) Over Time</h4>
        <canvas id="volumeChart" class="progress-chart"></canvas>
      </div>
      <div style="margin:1.5rem 0;">
        <h4>Calories Burned Over Time</h4>
        <canvas id="caloriesChart" class="progress-chart"></canvas>
      </div>
      <div style="margin:1.5rem 0;">
        <h4>Workouts per Week</h4>
        <canvas id="frequencyChart" class="progress-chart"></canvas>
      </div>

  <!-- SETTINGS TAB -->
  <div id="settingsTab" class="hidden">
    <div class="card">
      <h3>Settings</h3>
      <label>Bodyweight (lb):</label>
      <input type="number" id="bodyweightInput" value="200">
      <div style="margin:1rem 0;">
        <label>Theme:</label>
        <select id="themeSelect">
          <option value="dark">Dark Mode</option>
          <option value="light">Light Mode</option>
        </select>
      </div>
      <button style="width:100%;margin:1rem 0;" onclick="saveSettings()">Save</button>
      <button class="danger-btn" style="width:100%;" onclick="clearAllData()">Clear All History</button>
    </div>
  </div>

</div>

<script>
// ──────────────────────────────────────────────── DATA ────────────────────────────────────────────────
const EXERCISES = {
  Chest: [
    {name: "Wall Pectoral Stretch", muscle: "chest"},
    {name: "Chest Doorway Stretch", muscle: "chest"},
    {name: "Barbell Bench Press", muscle: "chest"},
    {name: "Hammer Curls", muscle: "arms"},
    {name: "Barbell Decline Bench Press", muscle: "chest"},
    {name: "Dumbbell Bicep Curl", muscle: "arms"},
    {name: "Barbell Incline Bench Press", muscle: "chest"},
    {name: "Incline Bench Press", muscle: "chest"},
    {name: "Incline Dumbbell Curl", muscle: "arms"},
    {name: "Standing Incline Cable Chest Press", muscle: "chest"},
    {name: "Standing Low Cable Chest Fly", muscle: "chest"},
    {name: "Preacher Curl", muscle: "arms"},
    {name: "Dumbbell Tricep Extension", muscle: "arms"},
    {name: "Barbell Shoulder Press", muscle: "shoulders"},
    {name: "Cable Rope Overhead Triceps Extension", muscle: "arms"},
    {name: "Cable Face Pull", muscle: "shoulders"},
    {name: "Cable Tricep Pushdown", muscle: "arms"},
    {name: "Cable Bicep Curl", muscle: "arms"},
    {name: "Tricep Stretch", muscle: "arms"},
    {name: "Dumbbell Kickbacks", muscle: "arms"},
    {name: "Dumbbell Tricep Extension", muscle: "arms"},
    {name: "Skullcrusher", muscle: "arms"},
    {name: "Assisted Dip", muscle: "chest"},
    {name: "Cable One Arm Tricep Side Extension", muscle: "arms"}
  ],
  Back: [
    {name: "Cable Row", muscle: "back"},
    {name: "Dumbbell Lateral Raises", muscle: "shoulders"},
    {name: "Lat Pulldown", muscle: "back"},
    {name: "Seated Back Extension", muscle: "back"},
    {name: "Assisted Chin Up", muscle: "back"},
    {name: "V-Bar Pulldown", muscle: "back"},
    {name: "Machine Shoulder Shrug", muscle: "shoulders"},
    {name: "Stiff Leg Barbell Good Morning", muscle: "back"},
    {name: "Smith Machine Upright Row", muscle: "shoulders"},
    {name: "Hammer Strength High Row", muscle: "back"},
    {name: "Hammer Strength Iso Row", muscle: "back"},
    {name: "Pull Up", muscle: "back"},
    {name: "Landmine Row", muscle: "back"},
    {name: "Neutral Grip Pull Up", muscle: "back"},
    {name: "Dead Hang", muscle: "back"},
    {name: "Foam Roll Upper Back", muscle: "back"},
    {name: "Foam Roll Lats", muscle: "back"},
    {name: "Treadmill", muscle: "cardio"}
  ],
  Legs: [
    {name: "Stair Stepper", muscle: "legs"},
    {name: "Deadlift", muscle: "legs"},
    {name: "Back Squat", muscle: "legs"},
    {name: "Machine Hip Adductor", muscle: "legs"},
    {name: "Machine Hip Abductor", muscle: "legs"},
    {name: "Glute Kickback Machine", muscle: "legs"},
    {name: "Leg Extension", muscle: "legs"},
    {name: "Seated Leg Curl", muscle: "legs"},
    {name: "Dorsiflexion Machine", muscle: "legs"},
    {name: "Barbell Hip Thrust", muscle: "legs"},
    {name: "Calf Press", muscle: "legs"},
    {name: "Seated Machine Calf Press", muscle: "legs"},
    {name: "Leg Press", muscle: "legs"},
    {name: "Sled Push", muscle: "legs"},
    {name: "Sumo Deadlift", muscle: "legs"},
    {name: "Smith Machine Single Leg Split Squat", muscle: "legs"},
    {name: "Dumbbell Lunge", muscle: "legs"},
    {name: "Treadmill", muscle: "cardio"}
  ],
  Cardio: [
    {name: "Treadmill", muscle: "cardio"},
    {name: "Stairs", muscle: "cardio"}
  ]
};

let workoutStartTime, timerInterval, restInterval;
let currentExercises = [];
let caloriesBurned = 0;
let totalVolume = 0;
let bodyweight = parseInt(localStorage.getItem('benge_bw')) || 200;
let history = JSON.parse(localStorage.getItem('benge_history') || '[]');
let theme = localStorage.getItem('benge_theme') || 'dark';
let muscleSoreness = JSON.parse(localStorage.getItem('benge_soreness') || '{}');

document.body.classList.toggle('light', theme === 'light');
document.getElementById('bodyweightInput').value = bodyweight;
document.getElementById('themeSelect').value = theme;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// ──────────────────────────────────────────────── UI FUNCTIONS ────────────────────────────────────────────────
function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');

  document.getElementById('workoutTab').classList.toggle('hidden', tab !== 'workout');
  document.getElementById('historyTab').classList.toggle('hidden', tab !== 'history');
  document.getElementById('progressTab').classList.toggle('hidden', tab !== 'progress');
  document.getElementById('settingsTab').classList.toggle('hidden', tab !== 'settings');

  if (tab === 'history') loadHistory();
  if (tab === 'progress') loadBodyDiagram();
}

function startNewWorkout() {
  currentExercises = [];
  caloriesBurned = 0;
  totalVolume = 0;
  workoutStartTime = Date.now();

  clearInterval(timerInterval);
  timerInterval = setInterval(updateWorkoutTimer, 1000);

  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('activeWorkout').classList.remove('hidden');

  loadPresetExercises();
  renderExercises();
  updateStats();
}

function updateWorkoutTimer() {
  let sec = Math.floor((Date.now() - workoutStartTime) / 1000);
  let m = Math.floor(sec / 60).toString().padStart(2,'0');
  let s = (sec % 60).toString().padStart(2,'0');
  document.getElementById('workoutTimer').textContent = `${m}:${s}`;
}

function loadPresetExercises() {
  const cat = document.getElementById('categorySelect').value;
  EXERCISES[cat].forEach(ex => addExercise(ex.name, ex.muscle));
}

function addExercise(name, muscle) {
  currentExercises.push({
    name,
    muscle,
    sets: [],
    supersetGroup: null
  });
  renderExercises();
}

function addExercisePrompt() {
  const select = document.createElement('select');
  Object.values(EXERCISES).flat().forEach(({name}) => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.text = name;
    select.add(opt);
  });
  const popup = document.createElement('div');
  popup.style.position = 'fixed';
  popup.style.top = '50%';
  popup.style.left = '50%';
  popup.style.transform = 'translate(-50%, -50%)';
  popup.style.background = 'var(--card)';
  popup.style.padding = '1rem';
  popup.style.borderRadius = '10px';
  popup.style.border = '1px solid var(--accent)';
  popup.innerHTML = `<h3>Select Exercise</h3>${select.outerHTML}<br><button onclick="addExercise(this.previousSibling.value, getMuscleGroup(this.previousSibling.value));this.parentElement.remove()">Add</button><button onclick="this.parentElement.remove()">Cancel</button>`;
  document.body.appendChild(popup);
}

function getMuscleGroup(name) {
  name = name.toLowerCase();
  if (name.includes('bench') || name.includes('chest') || name.includes('fly') || name.includes('dip')) return 'chest';
  if (name.includes('row') || name.includes('pull') || name.includes('lat') || name.includes('back')) return 'back';
  if (name.includes('squat') || name.includes('leg') || name.includes('lunge') || name.includes('deadlift') || name.includes('calf')) return 'legs';
  if (name.includes('curl') || name.includes('tricep') || name.includes('extension') || name.includes('kickback')) return 'arms';
  if (name.includes('shoulder') || name.includes('raise') || name.includes('shrug') || name.includes('press') && name.includes('shoulder')) return 'shoulders';
  if (name.includes('treadmill') || name.includes('stairs') || name.includes('cardio')) return 'cardio';
  return 'other';
}

function groupSuperset() {
  renderExercises(true); // with checkboxes
}

function renderExercises(withChecks = false) {
  const container = document.getElementById('exercisesContainer');
  container.innerHTML = '';

  let i = 0;
  while (i < currentExercises.length) {
    const ex = currentExercises[i];
    
    // Check if this exercise starts or is part of a superset group
    if (ex.supersetGroup !== null) {
      const groupId = ex.supersetGroup;
      const groupContainer = document.createElement('div');
      groupContainer.className = 'superset-group';
      
      // Label for the superset group
      groupContainer.innerHTML = `<div style="color:#ff6b6b; font-size:0.7rem; font-weight:bold; margin-bottom:10px; text-transform:uppercase;">Superset</div>`;

      // Group all exercises with the same ID together
      while (i < currentExercises.length && currentExercises[i].supersetGroup === groupId) {
        groupContainer.appendChild(createExerciseHTML(currentExercises[i], i, withChecks));
        
        // Add the red connector arrow if another exercise follows in this same group
        if (i + 1 < currentExercises.length && currentExercises[i+1].supersetGroup === groupId) {
          const arrow = document.createElement('div');
          arrow.className = 'arrow-line';
          groupContainer.appendChild(arrow);
        }
        i++;
      }
      container.appendChild(groupContainer);
    } else {
      // Normal exercise - render it standard
      container.appendChild(createExerciseHTML(ex, i, withChecks));
      i++;
    }
  }

  // Handle the confirmation button if we are in "Grouping Mode"
  if (withChecks) {
    const btn = document.createElement('button');
    btn.textContent = 'Link Selected as Superset';
    btn.style.cssText = "width:100%; margin-top:1rem; background:var(--success);";
    btn.onclick = () => {
      const selected = [];
      document.querySelectorAll('.select-check:checked').forEach(check => selected.push(parseInt(check.dataset.idx)));
      if (selected.length < 2) return alert("Select at least 2 exercises");
      const groupId = Date.now();
      selected.forEach(idx => currentExercises[idx].supersetGroup = groupId);
      renderExercises();
    };
    container.appendChild(btn);
  }
}

// Helper function to create the actual exercise card HTML
function createExerciseHTML(ex, i, withChecks) {
  const card = document.createElement('div');
  card.className = 'exercise-container';
  card.innerHTML = `
    <div class="muscle-visual">${ex.muscle.toUpperCase()}</div>
    <div class="exercise-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;">
        <strong>${ex.name}</strong>
        <div>
          <button class="reorder-btn" onclick="moveExercise(${i},-1)">↑</button>
          <button class="reorder-btn" onclick="moveExercise(${i},1)">↓</button>
        </div>
      </div>
      <div class="set-row">
        <input type="number" placeholder="Weight" id="w_${i}">
        <input type="number" placeholder="Reps" id="r_${i}">
        <button onclick="logSet(${i})">Log</button>
      </div>
      <div id="sets_${i}" class="sets-log"></div>
      <div style="margin-top:1rem;display:flex;gap:0.8rem;">
        <button class="danger-btn" onclick="removeExercise(${i})">Remove</button>
        <button onclick="showReplaceOptions(${i})">Replace</button>
        ${withChecks ? `<label style="font-size:0.8rem;"><input type="checkbox" class="select-check" data-idx="${i}"> Select</label>` : ''}
      </div>
    </div>
  `;

  // Restore logged sets
  const setsDiv = card.querySelector(`#sets_${i}`);
  ex.sets.forEach((s, si) => {
    const item = document.createElement('div');
    item.innerHTML = `Set ${si+1}: ${s.weight || 'BW'} × ${s.reps} <button class="danger-btn" onclick="removeSet(${i},${si})">×</button>`;
    setsDiv.appendChild(item);
  });
  return card;
}
  
function logSet(idx) {
  const w = parseFloat(document.getElementById(`w_${idx}`).value) || 0;
  const r = parseInt(document.getElementById(`r_${idx}`).value);

  if (!r || r < 1) return alert("Enter valid reps");

  currentExercises[idx].sets.push({weight: w, reps: r});

  caloriesBurned += Math.round(5 + (bodyweight * 0.1) + (r * 2));
  totalVolume += w * r;

  updateStats();
  renderExercises();

  document.getElementById(`rest_${idx}`).style.display = 'block';
  startRest(120, idx);
}

function startRest(seconds, idx) {
  let time = seconds;
  const disp = document.getElementById(`rest_${idx}`);
  disp.textContent = time;

  const intv = setInterval(() => {
    time--;
    disp.textContent = time;
    if (time <= 0) {
      clearInterval(intv);
      disp.textContent = "GO!";
      beep();
    }
  }, 1000);
}

function removeExercise(idx) {
  if (confirm("Remove exercise?")) {
    currentExercises.splice(idx, 1);
    renderExercises();
  }
}

function removeSet(exIdx, setIdx) {
  if (confirm("Delete set?")) {
    currentExercises[exIdx].sets.splice(setIdx, 1);
    renderExercises();
  }
}

function moveExercise(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= currentExercises.length) return;
  [currentExercises[idx], currentExercises[newIdx]] = [currentExercises[newIdx], currentExercises[idx]];
  renderExercises();
}

function showReplaceOptions(idx) {
  const currentEx = currentExercises[idx];
  
  // Create Modal Overlay (Dark background)
  const overlay = document.createElement('div');
  overlay.id = "replaceModal";
  overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:2000;display:flex;align-items:center;justify-content:center;padding:1rem;';
  
  // Create Modal Box
  const modal = document.createElement('div');
  modal.style.cssText = 'background:#1a1a1a; width:100%; max-width:500px; max-height:80vh; border-radius:15px; padding:1.5rem; display:flex; flex-direction:column; border:2px solid #0066ff; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5);';
  
  modal.innerHTML = `
    <h3 style="margin-bottom:1rem; font-size:1.2rem;">Replace "${currentEx.name}"</h3>
    <input type="text" id="exerciseSearch" placeholder="Search 200+ exercises..." style="margin-bottom:1rem; padding:0.8rem; background:#222; color:white; border:1px solid #444; border-radius:8px; width: 100%;">
    <div id="replacementList" style="overflow-y:auto; flex:1; border-top:1px solid #333; padding-top:0.5rem;">
      </div>
    <button onclick="document.getElementById('replaceModal').remove()" style="margin-top:1rem; background:#444; color:white; padding:0.8rem; border-radius:8px; border:none; cursor:pointer; font-weight:600;">Cancel</button>
  `;

  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  const searchInput = modal.querySelector('#exerciseSearch');
  const listContainer = modal.querySelector('#replacementList');

  // Function to filter and show exercises
  const renderList = (filter = "") => {
    listContainer.innerHTML = '';
    // This pulls from the EXERCISES object at the top of your script
    const allOptions = Object.values(EXERCISES).flat();
    
    const filtered = allOptions.filter(ex => 
      ex.name.toLowerCase().includes(filter.toLowerCase())
    );

    filtered.forEach(ex => {
      const btn = document.createElement('button');
      btn.style.cssText = 'width:100%; text-align:left; background:none; border-bottom:1px solid #282828; padding:1rem; color:white; border-radius:0; border-top:none; border-left:none; border-right:none; cursor:pointer; transition: 0.2s;';
      btn.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-weight:500;">${ex.name}</span>
          <span style="font-size:0.7rem; color:#0066ff; text-transform:uppercase; border:1px solid #0066ff; padding:2px 6px; border-radius:4px;">${ex.muscle}</span>
        </div>
      `;
      
      btn.onmouseover = () => btn.style.background = '#222';
      btn.onmouseout = () => btn.style.background = 'none';
      
      btn.onclick = () => {
        replaceExercise(idx, ex.name);
        overlay.remove();
      };
      listContainer.appendChild(btn);
    });
  };

  // Initial show and setup search focus
  renderList();
  searchInput.focus();
  searchInput.oninput = (e) => renderList(e.target.value);
}

function replaceExercise(idx, newName) {
  currentExercises[idx].name = newName;
  currentExercises[idx].muscle = getMuscleGroup(newName);
  renderExercises();
}

function updateStats() {
  document.getElementById('calDisplay').textContent = caloriesBurned;
  document.getElementById('volDisplay').textContent = totalVolume;
}

function beep() {
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  oscillator.type = 'square';
  oscillator.frequency.value = 800;
  gainNode.gain.value = 0.1;
  oscillator.start();
  setTimeout(() => oscillator.stop(), 150);
}

function finishWorkout() {
  const performedExercises = currentExercises.filter(ex => ex.sets.length > 0);
  if (!performedExercises.length) return alert("No workouts performed - nothing to save.");

  const duration = document.getElementById('workoutTimer').textContent;
  const entry = {
    date: new Date().toLocaleString(),
    duration,
    calories: caloriesBurned,
    volume: totalVolume,
    exercises: performedExercises.map(ex => ({
      name: ex.name,
      muscle: ex.muscle,
      sets: ex.sets
    }))
  };

  history.push(entry);
  localStorage.setItem('benge_history', JSON.stringify(history));

  alert(`Saved!\n${duration} • ${caloriesBurned} kcal • ${totalVolume} lb`);

  currentExercises = [];
  caloriesBurned = 0;
  totalVolume = 0;
  clearInterval(timerInterval);
  document.getElementById('activeWorkout').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
}

function loadHistory() {
  const container = document.getElementById('historyList');
  container.innerHTML = history.length ? '' : '<p>No workouts saved yet.</p>';

  history.slice().reverse().forEach((w, revIdx) => {
    const idx = history.length - 1 - revIdx;
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `
      <strong>${w.date}</strong><br>
      Duration: ${w.duration} • Calories: ${w.calories} kcal • Volume: ${w.volume} lb<br>
      <small>${w.exercises.map(e => e.name).join(' • ')}</small><br>
      <button onclick="toggleHistoryDetails(${idx})">Details</button>
      <div id="details_${idx}" class="hidden"></div>
      <button class="danger-btn" onclick="deleteHistoryEntry(${idx})">Delete</button>
    `;
    container.appendChild(div);
  });
}

function toggleHistoryDetails(idx) {
  const details = document.getElementById(`details_${idx}`);
  details.classList.toggle('hidden');
  if (details.innerHTML) return;

  let html = '';
  history[idx].exercises.forEach(ex => {
    html += `<b>${ex.name} (${ex.muscle})</b><br>`;
    ex.sets.forEach(s => html += `${s.weight || 'BW'} × ${s.reps}<br>`);
    html += '<br>';
  });
  details.innerHTML = html;
}

function deleteHistoryEntry(idx) {
  if (confirm("Delete this workout?")) {
    history.splice(idx, 1);
    localStorage.setItem('benge_history', JSON.stringify(history));
    loadHistory();
  }
}

function exportHistory() {
  let csv = 'Date,Duration,Calories,Volume,Exercise,Muscle,Weight,Reps\n';
  history.forEach(w => {
    w.exercises.forEach(ex => {
      ex.sets.forEach(s => {
        csv += `"${w.date}","${w.duration}",${w.calories},${w.volume},"${ex.name}","${ex.muscle || 'unknown'}",${s.weight || 'BW'},${s.reps}\n`;
      });
    });
  });
  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'benge_history.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function loadBodyDiagram() {
  const container = document.getElementById('progressTab').querySelector('.card');
  const existingDiagrams = container.querySelectorAll('.realistic-muscle-map');
  
  // Clear any existing complex diagrams
  existingDiagrams.forEach(d => d.remove());
  
  // Add freshness labels container if it doesn't exist
  if (!document.getElementById('freshnessLabels')) {
    const labelDiv = document.createElement('div');
    labelDiv.id = 'freshnessLabels';
    labelDiv.style.marginTop = '1rem';
    container.appendChild(labelDiv);
  } else {
    document.getElementById('freshnessLabels').innerHTML = '';
  }

  // Define the detailed muscle maps (Realistic SVGs)
  const views = {
    front: createRealisticFrontSVG(),
    back: createRealisticBackSVG()
  };

  // Process and display each map
  Object.keys(views).forEach(viewName => {
    const viewTitle = viewName.charAt(0).toUpperCase() + viewName.slice(1);
    const diagramDiv = document.createElement('div');
    diagramDiv.className = `realistic-muscle-map realistic-${viewName}-view`;
    diagramDiv.innerHTML = `<h4>${viewTitle} View (Muscle Diagram)</h4>${views[viewName]}`;
    
    container.insertBefore(diagramDiv, document.getElementById('freshnessLabels'));
    
    // Apply freshness coloring based on muscle group stats
    Object.keys(EXERCISES).forEach(cat => {
      // Muscle category IDs in SVG match category names in EXERCISES (case-sensitive)
      applyMuscleFreshnessToSVG(viewName, cat); 
    });
  });
}

// Logic to apply color based on muscle group and view
function applyMuscleFreshnessToSVG(viewName, muscleCat) {
  // Convert category name to match SVG group IDs (Chest -> Chest_group)
  const groupID = `${muscleCat}_group`;
  const viewSVG = document.querySelector(`.realistic-${viewName}-view svg`);
  
  if (!viewSVG) return;
  const muscleGroup = viewSVG.getElementById(groupID);
  
  if (!muscleGroup) return;

  // Calculate freshness based on category stats
  const { volume, daysSinceLast } = calculateMuscleStats(muscleCat.toLowerCase());
  
  // More accurate freshness: base soreness on volume, recover exponentially over days
  const soreness = Math.min(100, volume / 100 * Math.exp(-daysSinceLast / 2)); // recover half every 2 days
  const freshness = 100 - soreness;
  
  // Apply classes based on freshness threshold
  muscleGroup.classList.toggle('muscle-fresh', freshness > 50);
  muscleGroup.classList.toggle('muscle-sore', freshness <= 50);
  
  // Optional: Set opacity based on recovery percentage (50% = base grey, 100% = full color)
  muscleGroup.style.opacity = Math.max(0.5, freshness / 100); 
  
  // Add percentage label to freshness list
  const labels = document.getElementById('freshnessLabels');
  labels.innerHTML += `<p>${muscleCat}: ${Math.round(freshness)}% fresh</p>`;
}

function calculateMuscleStats(muscle) {
  let volume = 0;
  let lastDate = null;

  history.forEach(w => {
    w.exercises.forEach(ex => {
      if (ex.muscle === muscle) {
        ex.sets.forEach(s => volume += (s.weight || 0) * s.reps);
        const d = new Date(w.date);
        if (!lastDate || d > lastDate) lastDate = d;
      }
    });
  });

  const daysSinceLast = lastDate ? Math.max(0, Math.floor((Date.now() - lastDate) / (24*60*60*1000))) : Infinity;

  return {volume, daysSinceLast};
}

function refreshProgressCharts() {
  const dates = history.map(w => w.date.split(',')[0]);
  const volumes = history.map(w => w.volume);
  const cals = history.map(w => w.calories);

  // Volume Chart
  new Chart(document.getElementById('volumeChart'), {
    type: 'line',
    data: {
      labels: dates,
      datasets: [{ label: 'Total Volume (lb)', data: volumes, borderColor: '#36a2eb', tension: 0.1 }]
    },
    options: { responsive: true, scales: { y: { beginAtZero: true } } }
  });

  // Calories Chart
  new Chart(document.getElementById('caloriesChart'), {
    type: 'line',
    data: {
      labels: dates,
      datasets: [{ label: 'Calories Burned', data: cals, borderColor: '#ff6384', tension: 0.1 }]
    },
    options: { responsive: true, scales: { y: { beginAtZero: true } } }
  });

  // Frequency Chart
  const weekly = {};
  history.forEach(w => {
    const d = new Date(w.date);
    const week = `${d.getFullYear()}-W${Math.floor((d.getDate() - 1 + (d.getDay() || 7)) / 7).toString().padStart(2, '0')}`;
    weekly[week] = (weekly[week] || 0) + 1;
  });
  new Chart(document.getElementById('frequencyChart'), {
    type: 'bar',
    data: {
      labels: Object.keys(weekly),
      datasets: [{ label: 'Workouts per Week', data: Object.values(weekly), backgroundColor: '#4bc0c0' }]
    },
    options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
  });
}

function saveSettings() {
  bodyweight = parseInt(document.getElementById('bodyweightInput').value) || 200;
  localStorage.setItem('benge_bw', bodyweight);
  theme = document.getElementById('themeSelect').value;
  localStorage.setItem('benge_theme', theme);
  document.body.classList.toggle('light', theme === 'light');
  alert("Settings saved.");
}

function clearAllData() {
  if (confirm("Clear all history?")) {
    history = [];
    localStorage.removeItem('benge_history');
    loadHistory();
  }
}
