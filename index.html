<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benge Fitness Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{margin:0;font-family:'Roboto',sans-serif;background:#0d0d0d;color:#fff;}
header{background:#1a1a1a;padding:18px;font-size:24px;font-weight:700;text-align:center;letter-spacing:1px;}
.container{padding:12px}
.tabs{display:flex;margin-bottom:12px;gap:6px}
.tab{flex:1;padding:10px;background:#222;border-radius:8px;text-align:center;font-weight:700;cursor:pointer}
.tab.active{background:#2e7dff;color:#fff}
.card{background:#1c1c1c;padding:14px;border-radius:12px;margin-bottom:14px}
.exercise-card{background:#262626;padding:12px;border-radius:12px;margin-bottom:12px}
.exercise-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.set-row{display:flex;gap:6px;margin-bottom:6px}
.set-row input{flex:1;padding:6px;border-radius:6px;border:none}
.set-row button{padding:6px 10px;border-radius:6px;border:none;background:#2e7dff;color:#fff;font-weight:700}
.video{color:#6ab0ff;text-decoration:underline;cursor:pointer;font-size:13px}
img.exercise-img{width:100%;border-radius:8px;margin-top:6px}
.timer{font-size:28px;margin:8px 0;text-align:center}
.history-item{font-size:13px;border-bottom:1px solid #333;padding:8px 0}
.add-exercise-btn{padding:10px;border:none;border-radius:8px;background:#2e7dff;color:#fff;font-weight:700;margin-top:6px;width:100%;cursor:pointer}
.hidden{display:none}
.body-diagram{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;margin-top:20px}
.body-diagram svg{width:180px;height:360px}
.muscle{fill:#28a745;transition:fill 0.5s}
</style>
</head>
<body>
<header>Benge Fitness Pro</header>
<div class="container">

<div class="tabs">
<div class="tab active" id="tabWorkout" onclick="switchTab('workout')">Workout</div>
<div class="tab" id="tabHistory" onclick="switchTab('history')">History</div>
<div class="tab" id="tabProgress" onclick="switchTab('progress')">Progress</div>
</div>

<div id="workoutTab">
<div class="card">
<h3>New Workout</h3>
<select id="category">
<option>Chest</option>
<option>Back</option>
<option>Legs</option>
<option>Cardio</option>
</select>
<button class="add-exercise-btn" onclick="startWorkout()">Start Workout</button>
</div>

<div id="activeWorkout" class="hidden">
<div class="card">
<div class="timer" id="timer">00:00</div>
<div style="text-align:center;margin:6px 0">Calories Burned: <span id="calories">0</span></div>
<button class="add-exercise-btn" onclick="endWorkout()">Finish Workout</button>
</div>

<div id="exerciseList"></div>
<button class="add-exercise-btn" onclick="addExercise()">Add Exercise</button>

<div class="card">
<h3>Rest Timer</h3>
<div id="rest">120</div>
<button onclick="setRest(60)">60s</button>
<button onclick="setRest(90)">90s</button>
<button onclick="setRest(120)">120s</button>
<button onclick="setRest(180)">180s</button>
</div>
</div>
</div>

<div id="historyTab" class="hidden">
<div class="card">
<h3>Workout History</h3>
<div id="history"></div>
</div>
</div>

<div id="progressTab" class="hidden">
<div class="card">
<h3>Muscle Recovery</h3>
<div class="body-diagram">

<div>
<h4>Front</h4>
<svg viewBox="0 0 200 400">
<rect x="80" y="20" width="40" height="40" rx="20" fill="#aaa"/>
<rect x="60" y="60" width="80" height="150" rx="20" fill="#aaa"/>
<rect x="80" y="90" width="40" height="60" class="muscle" id="chest"/>
<rect x="60" y="210" width="40" height="140" class="muscle" id="leftLeg"/>
<rect x="100" y="210" width="40" height="140" class="muscle" id="rightLeg"/>
<rect x="40" y="70" width="20" height="120" class="muscle" id="leftArm"/>
<rect x="140" y="70" width="20" height="120" class="muscle" id="rightArm"/>
</svg>
</div>

<div>
<h4>Back</h4>
<svg viewBox="0 0 200 400">
<rect x="80" y="20" width="40" height="40" rx="20" fill="#aaa"/>
<rect x="60" y="60" width="80" height="150" rx="20" fill="#aaa"/>
<rect x="80" y="90" width="40" height="120" class="muscle" id="back"/>
</svg>
</div>

</div>
<button class="add-exercise-btn" onclick="updateMuscleRecovery()">Refresh Recovery</button>
</div>
</div>

</div>

<script>
let startTime, timerInterval, restDefault=120, calories=0, bodyweight=230, workout=[];
let muscleLastWorked = JSON.parse(localStorage.getItem('muscleLastWorked')||"{}");

const exerciseDB=[
{name:"Bench Press",muscle:"chest",img:"https://upload.wikimedia.org/wikipedia/commons/3/3a/Pectoralis_major.png",vid:"https://www.youtube.com/watch?v=rT7DgCr-3pg"},
{name:"Incline Bench",muscle:"chest",img:"https://upload.wikimedia.org/wikipedia/commons/3/3a/Pectoralis_major.png",vid:"https://www.youtube.com/watch?v=DbFgADa2PL8"},
{name:"Lat Pulldown",muscle:"back",img:"https://upload.wikimedia.org/wikipedia/commons/1/1d/Musculi_dorsi.png",vid:"https://www.youtube.com/watch?v=CAwf7n6Luuc"},
{name:"Cable Row",muscle:"back",img:"https://upload.wikimedia.org/wikipedia/commons/1/1d/Musculi_dorsi.png",vid:"https://www.youtube.com/watch?v=HJSVR_67OlM"},
{name:"Back Squat",muscle:"legs",img:"https://upload.wikimedia.org/wikipedia/commons/6/6e/Quadriceps_femoris.png",vid:"https://www.youtube.com/watch?v=Dy28eq2PjcM"},
{name:"Leg Press",muscle:"legs",img:"https://upload.wikimedia.org/wikipedia/commons/6/6e/Quadriceps_femoris.png",vid:"https://www.youtube.com/watch?v=IZxyjW7MPJQ"},
{name:"Treadmill",muscle:"cardio",img:"https://upload.wikimedia.org/wikipedia/commons/4/4a/Heart_anatomy_en.png",vid:"https://www.youtube.com/watch?v=brFHyOtTwH4"}
];

function switchTab(tab){
 document.getElementById('workoutTab').classList.add('hidden');
 document.getElementById('historyTab').classList.add('hidden');
 document.getElementById('progressTab').classList.add('hidden');
 document.getElementById('tabWorkout').classList.remove('active');
 document.getElementById('tabHistory').classList.remove('active');
 document.getElementById('tabProgress').classList.remove('active');
 if(tab==='workout'){document.getElementById('workoutTab').classList.remove('hidden');document.getElementById('tabWorkout').classList.add('active');}
 if(tab==='history'){document.getElementById('historyTab').classList.remove('hidden');document.getElementById('tabHistory').classList.add('active');loadHistory();}
 if(tab==='progress'){document.getElementById('progressTab').classList.remove('hidden');document.getElementById('tabProgress').classList.add('active');updateMuscleRecovery();}
}

function startWorkout(){
 calories=0; workout=[];
 startTime=Date.now();
 timerInterval=setInterval(updateTimer,1000);
 document.getElementById('activeWorkout').classList.remove('hidden');
 document.getElementById('exerciseList').innerHTML='';
 loadPreset();
}

function updateTimer(){
 let diff=Math.floor((Date.now()-startTime)/1000);
 let m=Math.floor(diff/60), s=diff%60;
 document.getElementById('timer').innerText=(m<10?'0':'')+m+':' + (s<10?'0':'')+s;
}

function loadPreset(){
 let cat=document.getElementById('category').value;
 let list=[];
 if(cat==='Chest') list=['Bench Press','Incline Bench'];
 if(cat==='Back') list=['Lat Pulldown','Cable Row'];
 if(cat==='Legs') list=['Back Squat','Leg Press'];
 if(cat==='Cardio') list=['Treadmill'];
 list.forEach(e=>createExercise(e));
}

function createExercise(name){
 let data=exerciseDB.find(x=>x.name===name)||{name:name,img:'',vid:'',muscle:'other'};
 let id='ex'+Date.now()+Math.random();
 workout.push({name:data.name,sets:[],muscle:data.muscle});
 let div=document.createElement('div');
 div.className='exercise-card';
 div.id=id;
 div.innerHTML=`
 <div class='exercise-header'><b>${data.name}</b><span class='video' onclick="openVideo('${data.vid}')">Watch Demo</span></div>
 ${data.img?`<img class='exercise-img' src='${data.img}'>`:``}
 <div class='set-row'><input placeholder='Weight' id='w${id}'><input placeholder='Reps' id='r${id}'><button onclick="finishSet('${id}')">Log Set</button></div>
 <div id='sets${id}'></div>`;
 document.getElementById('exerciseList').appendChild(div);
}

function addExercise(){
 let name=prompt('Exercise Name');
 if(name) createExercise(name);
}

function finishSet(id){
 let w=document.getElementById('w'+id).value, r=document.getElementById('r'+id).value;
 if(!w||!r) return;
 let log=document.createElement('div');
 log.innerText=w+' lb x '+r;
 document.getElementById('sets'+id).appendChild(log);
 let setCalories=(6*(bodyweight*0.4536)*0.008);
 calories+=setCalories;
 document.getElementById('calories').innerText=Math.round(calories);
 startRest();
}

function startRest(){
 let time=restDefault;
 let el=document.getElementById('rest');
 let restInt=setInterval(()=>{
 time--;
 el.innerText=time;
 if(time<=0){clearInterval(restInt); el.innerText=restDefault;}
 },1000);
}

function setRest(sec){restDefault=sec; document.getElementById('rest').innerText=sec;}

function endWorkout(){
 clearInterval(timerInterval);
 let duration=document.getElementById('timer').innerText;
 let entry={date:new Date().toLocaleDateString(), duration:duration, calories:Math.round(calories)};
 let history=JSON.parse(localStorage.getItem('bengeHistory')||'[]');
 history.push(entry);
 localStorage.setItem('bengeHistory',JSON.stringify(history));

 workout.forEach(ex=>{
 muscleLastWorked[ex.muscle]=Date.now();
 });
 localStorage.setItem('muscleLastWorked',JSON.stringify(muscleLastWorked));

 loadHistory();
 alert('Workout Saved!');
}

function loadHistory(){
 let history=JSON.parse(localStorage.getItem('bengeHistory')||'[]');
 let div=document.getElementById('history'); div.innerHTML='';
 history.slice().reverse().forEach(h=>{
 let el=document.createElement('div'); el.className='history-item';
 el.innerHTML=`<b>${h.date}</b><br>Duration: ${h.duration}<br>Calories: ${h.calories}`;
 div.appendChild(el);
 });
}

function updateMuscleRecovery(){
 const muscles=['chest','back','legs','leftArm','rightArm','leftLeg','rightLeg'];
 muscles.forEach(m=>{
 let el=document.getElementById(m);
 if(!el) return;
 let last=muscleLastWorked[m]||0;
 let days=(Date.now()-last)/(1000*60*60*24);
 let recovery=Math.min(days/3,1);
 let red=Math.round(255*(1-recovery));
 let green=Math.round(255*recovery);
 el.style.fill=`rgb(${red},${green},0)`;
 });
}

function openVideo(url){if(url) window.open(url);} 

loadHistory();
</script>
</body>
</html>
