<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Benge Fitness Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #121212;
      --accent: #0066ff;
      --accent-dark: #004ccc;
      --success: #28a745;
      --danger: #ff4444;
      --text: #e0e0e0;
      --superset: #ff6b6b33;
      --light-bg: #f0f0f0;
      --light-card: #ffffff;
      --light-text: #0a0a0a;
    }
    body.light {
      --bg: var(--light-bg);
      --card: var(--light-card);
      --text: var(--light-text);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    header {
      background: #111;
      padding: 1.1rem;
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      border-bottom: 1px solid #222;
    }
    body.light header { background: #ddd; border-bottom: 1px solid #ccc; }
    .container { max-width: 680px; margin: 0 auto; padding: 1rem; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin: 1.2rem 0;
    }
    .tab {
      padding: 1rem;
      background: #1e1e1e;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
    }
    body.light .tab { background: #ddd; }
    .tab.active {
      background: var(--accent);
      color: white;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.3rem;
      margin-bottom: 1.3rem;
      border: 1px solid #222;
    }
    body.light .card { border: 1px solid #ccc; }
    button, select, input {
      padding: 0.8rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }
    select, input { background: #1e1e1e; color: white; width: 100%; margin: 0.5rem 0; }
    body.light select, body.light input { background: #f0f0f0; color: black; }
    button { background: var(--accent); color: white; cursor: pointer; }
    button:hover { background: var(--accent-dark); }
    .success-btn { background: var(--success); }
    .success-btn:hover { background: #218838; }
    .danger-btn { background: var(--danger); padding: 0.5rem 1rem; font-size: 0.9rem; }
    .exercise-card {
      background: #181818;
      border-radius: 10px;
      padding: 1.1rem;
      margin-bottom: 1.2rem;
      border: 1px solid #282828;
      position: relative;
    }
    body.light .exercise-card { background: #e8e8e8; border: 1px solid #ccc; }
    .superset-group { background: var(--superset); border-left: 4px solid #ff6b6b; padding-left: 1rem; margin: 0.8rem 0; border-radius: 6px; }
    .exercise-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.7rem; }
    .video-link { color: #4da6ff; cursor: pointer; font-size: 0.95rem; text-decoration: underline; }
    .set-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 0.6rem; margin: 0.6rem 0; }
    .set-row input { text-align: center; }
    .sets-log div { margin: 0.4rem 0; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; }
    .timer { font-size: 3.2rem; font-weight: bold; text-align: center; margin: 1rem 0; letter-spacing: 2px; }
    .rest-display { font-size: 2.8rem; text-align: center; margin: 1rem 0; font-weight: 600; }
    .history-item { padding: 1.1rem 0; border-bottom: 1px solid #222; }
    body.light .history-item { border-bottom: 1px solid #ccc; }
    .hidden { display: none !important; }
    .body-diagram { text-align: center; }
    .body-diagram svg { width: 100%; height: auto; }
    .muscle { fill: #ddd; }
    .muscle-worked { fill: red; opacity: 0.6; }
    .reorder-btn { background: none; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; }
  </style>
</head>
<body>

<header>Benge Fitness Pro</header>

<div class="container">

  <div class="tabs">
    <div class="tab active" onclick="showTab('workout')">Workout</div>
    <div class="tab" onclick="showTab('history')">History</div>
    <div class="tab" onclick="showTab('progress')">Progress</div>
    <div class="tab" onclick="showTab('settings')">Settings</div>
  </div>

  <!-- WORKOUT TAB -->
  <div id="workoutTab">
    <div class="card" id="startScreen">
      <h3>Start New Workout</h3>
      <select id="categorySelect">
        <option value="Chest">Chest</option>
        <option value="Back">Back</option>
        <option value="Legs">Legs</option>
        <option value="Cardio">Cardio</option>
      </select>
      <button class="success-btn" style="width:100%;margin-top:1rem;font-size:1.1rem;" onclick="startNewWorkout()">Begin</button>
    </div>

    <div id="activeWorkout" class="hidden">
      <div class="card">
        <div class="timer" id="workoutTimer">00:00</div>
        <div style="text-align:center; margin:0.6rem 0; font-size:1.1rem;">
          Calories (est): <b id="calDisplay">0</b> kcal<br>
          Total Volume: <b id="volDisplay">0</b> lb
        </div>
        <button onclick="finishWorkout()" style="width:100%;font-size:1.1rem;">Finish & Save</button>
      </div>

      <div id="exercisesContainer"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin:1.2rem 0;">
        <button class="success-btn" onclick="addExercisePrompt()">+ Add Exercise</button>
        <button onclick="groupSuperset()">Group Superset</button>
      </div>

      <div class="card">
        <h3>Rest Timer</h3>
        <div class="rest-display" id="restTimer">—</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0.6rem;">
          <button onclick="startRest(60)">60s</button>
          <button onclick="startRest(90)">90s</button>
          <button onclick="startRest(120)">120s</button>
          <button onclick="startRest(180)">180s</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HISTORY TAB -->
  <div id="historyTab" class="hidden">
    <div class="card">
      <h3>Workout History</h3>
      <button onclick="exportHistory()" style="width:100%;margin-bottom:1rem;">Export to Excel (CSV)</button>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- PROGRESS TAB -->
  <div id="progressTab" class="hidden">
    <div class="card">
      <h3>Body Progress Map</h3>
      <div class="body-diagram">
        <svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
          <!-- Simple body outline -->
          <rect x="80" y="20" width="40" height="40" rx="20" fill="#aaa" /> <!-- Head -->
          <rect x="60" y="60" width="80" height="150" rx="20" fill="#aaa" /> <!-- Torso -->
          <rect x="40" y="60" width="20" height="100" rx="10" fill="#aaa" class="muscle" id="left-arm" /> <!-- Left Arm -->
          <rect x="140" y="60" width="20" height="100" rx="10" fill="#aaa" class="muscle" id="right-arm" /> <!-- Right Arm -->
          <rect x="60" y="210" width="40" height="150" rx="10" fill="#aaa" class="muscle" id="left-leg" /> <!-- Left Leg -->
          <rect x="100" y="210" width="40" height="150" rx="10" fill="#aaa" class="muscle" id="right-leg" /> <!-- Right Leg -->
          <rect x="80" y="80" width="40" height="80" rx="10" fill="#aaa" class="muscle" id="chest" /> <!-- Chest -->
          <rect x="80" y="160" width="40" height="50" rx="10" fill="#aaa" class="muscle" id="abs" /> <!-- Abs -->
        </svg>
        <div id="sorenessInputs">
          <!-- Inputs for soreness % -->
        </div>
      </div>
    </div>
  </div>

  <!-- SETTINGS TAB -->
  <div id="settingsTab" class="hidden">
    <div class="card">
      <h3>Settings</h3>
      <label>Bodyweight (lb):</label>
      <input type="number" id="bodyweightInput" value="200">
      <div style="margin:1rem 0;">
        <label>Theme:</label>
        <select id="themeSelect">
          <option value="dark">Dark Mode</option>
          <option value="light">Light Mode</option>
        </select>
      </div>
      <button style="width:100%;margin-top:1rem;" onclick="saveSettings()">Save</button>
      <button class="danger-btn" style="width:100%;margin-top:1.5rem;" onclick="clearAllData()">Clear All History</button>
    </div>
  </div>

</div>

<script>
// ──────────────────────────────────────────────── DATA ────────────────────────────────────────────────
const EXERCISES = {
  Chest: [
    {name: "Wall Pectoral Stretch", muscle: "chest"},
    {name: "Chest Doorway Stretch", muscle: "chest"},
    {name: "Barbell Bench Press", muscle: "chest"},
    {name: "Hammer Curls", muscle: "arms"},
    {name: "Barbell Decline Bench Press", muscle: "chest"},
    {name: "Dumbbell Bicep Curl", muscle: "arms"},
    {name: "Barbell Incline Bench Press", muscle: "chest"},
    {name: "Incline Bench Press", muscle: "chest"},
    {name: "Incline Dumbbell Curl", muscle: "arms"},
    {name: "Standing Incline Cable Chest Press", muscle: "chest"},
    {name: "Standing Low Cable Chest Fly", muscle: "chest"},
    {name: "Preacher Curl", muscle: "arms"},
    {name: "Dumbbell Tricep Extension", muscle: "arms"},
    {name: "Barbell Shoulder Press", muscle: "shoulders"},
    {name: "Cable Rope Overhead Triceps Extension", muscle: "arms"},
    {name: "Cable Face Pull", muscle: "back"},
    {name: "Cable Tricep Pushdown", muscle: "arms"},
    {name: "Cable Bicep Curl", muscle: "arms"},
    {name: "Tricep Stretch", muscle: "arms"},
    {name: "Dumbbell Kickbacks", muscle: "arms"},
    {name: "Dumbbell Tricep Extension", muscle: "arms"},
    {name: "Skullcrusher", muscle: "arms"},
    {name: "Assisted Dip", muscle: "chest"},
    {name: "Cable One Arm Tricep Side Extension", muscle: "arms"}
  ],
  Back: [
    {name: "Cable Row", muscle: "back"},
    {name: "Dumbbell Lateral Raises", muscle: "shoulders"},
    {name: "Lat Pulldown", muscle: "back"},
    {name: "Seated Back Extension", muscle: "back"},
    {name: "Assisted Chin Up", muscle: "back"},
    {name: "Dumbbell Lateral Raise", muscle: "shoulders"},
    {name: "V-Bar Pulldown", muscle: "back"},
    {name: "Machine Shoulder Shrug", muscle: "shoulders"},
    {name: "Stiff Leg Barbell Good Morning", muscle: "legs"},
    {name: "Smith Machine Upright Row", muscle: "shoulders"},
    {name: "Hammer Strength High Row", muscle: "back"},
    {name: "Hammer Strength Iso Row", muscle: "back"},
    {name: "Pull Up", muscle: "back"},
    {name: "Landmine Row", muscle: "back"},
    {name: "Neutral Grip Pull Up", muscle: "back"},
    {name: "Dead Hang", muscle: "back"},
    {name: "Foam Roll Upper Back", muscle: "back"},
    {name: "Foam Roll Lats", muscle: "back"},
    {name: "Treadmill", muscle: "cardio"}
  ],
  Legs: [
    {name: "Stair Stepper", muscle: "legs"},
    {name: "Deadlift", muscle: "legs"},
    {name: "Back Squat", muscle: "legs"},
    {name: "Machine Hip Adductor", muscle: "legs"},
    {name: "Machine Hip Abductor", muscle: "legs"},
    {name: "Glute Kickback Machine", muscle: "legs"},
    {name: "Leg Extension", muscle: "legs"},
    {name: "Seated Leg Curl", muscle: "legs"},
    {name: "Dorsiflexion Machine", muscle: "legs"},
    {name: "Barbell Hip Thrust", muscle: "legs"},
    {name: "Calf Press", muscle: "legs"},
    {name: "Seated Machine Calf Press", muscle: "legs"},
    {name: "Leg Press", muscle: "legs"},
    {name: "Sled Push", muscle: "legs"},
    {name: "Sumo Deadlift", muscle: "legs"},
    {name: "Smith Machine Single Leg Split Squat", muscle: "legs"},
    {name: "Dumbbell Lunge", muscle: "legs"},
    {name: "Treadmill", muscle: "cardio"}
  ],
  Cardio: [
    {name: "Treadmill", muscle: "cardio"},
    {name: "Stairs", muscle: "cardio"}
  ]
};

let workoutStartTime, timerInterval, restInterval;
let currentExercises = [];
let caloriesBurned = 0;
let totalVolume = 0;
let bodyweight = parseInt(localStorage.getItem('benge_bw')) || 200;
let history = JSON.parse(localStorage.getItem('benge_history') || '[]');
let theme = localStorage.getItem('benge_theme') || 'dark';
let muscleSoreness = JSON.parse(localStorage.getItem('benge_soreness') || '{}');

document.body.classList.toggle('light', theme === 'light');
document.getElementById('bodyweightInput').value = bodyweight;
document.getElementById('themeSelect').value = theme;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// ──────────────────────────────────────────────── UI FUNCTIONS ────────────────────────────────────────────────
function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');

  document.getElementById('workoutTab').classList.toggle('hidden', tab !== 'workout');
  document.getElementById('historyTab').classList.toggle('hidden', tab !== 'history');
  document.getElementById('progressTab').classList.toggle('hidden', tab !== 'progress');
  document.getElementById('settingsTab').classList.toggle('hidden', tab !== 'settings');

  if (tab === 'history') loadHistory();
  if (tab === 'progress') loadBodyDiagram();
}

function startNewWorkout() {
  currentExercises = [];
  caloriesBurned = 0;
  totalVolume = 0;
  workoutStartTime = Date.now();

  clearInterval(timerInterval);
  timerInterval = setInterval(updateWorkoutTimer, 1000);

  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('activeWorkout').classList.remove('hidden');

  loadPresetExercises();
  renderExercises();
  updateStats();
}

function updateWorkoutTimer() {
  let sec = Math.floor((Date.now() - workoutStartTime) / 1000);
  let m = Math.floor(sec / 60).toString().padStart(2,'0');
  let s = (sec % 60).toString().padStart(2,'0');
  document.getElementById('workoutTimer').textContent = `${m}:${s}`;
}

function loadPresetExercises() {
  const cat = document.getElementById('categorySelect').value;
  EXERCISES[cat].forEach(ex => addExercise(ex.name, ex.muscle));
}

function addExercise(name, muscle) {
  currentExercises.push({
    name,
    muscle,
    demo: '', // Add if needed
    sets: [],
    supersetGroup: null
  });
  renderExercises();
}

function addExercisePrompt() {
  let name = prompt("Enter exercise name:");
  if (name && name.trim()) addExercise(name.trim(), 'unknown');
}

function groupSuperset() {
  renderExercises(true); // Render with checkboxes
  const groupBtn = document.createElement('button');
  groupBtn.textContent = 'Group Selected as Superset';
  groupBtn.onclick = () => {
    const selected = [];
    document.querySelectorAll('.select-check:checked').forEach(check => {
      selected.push(parseInt(check.dataset.idx));
    });
    if (selected.length < 2) return alert("Select at least 2 exercises");
    const groupId = Date.now();
    selected.forEach(idx => currentExercises[idx].supersetGroup = groupId);
    renderExercises();
  };
  document.getElementById('exercisesContainer').appendChild(groupBtn);
}

function renderExercises(withChecks = false) {
  const container = document.getElementById('exercisesContainer');
  container.innerHTML = '';

  let currentGroup = null;

  currentExercises.forEach((ex, i) => {
    if (ex.supersetGroup !== currentGroup) {
      if (currentGroup !== null) container.innerHTML += '</div>';
      if (ex.supersetGroup !== null) {
        container.innerHTML += '<div class="superset-group"><strong>Superset Group</strong>';
        currentGroup = ex.supersetGroup;
      } else {
        currentGroup = null;
      }
    }

    let card = document.createElement('div');
    card.className = 'exercise-card';
    card.innerHTML = `
      <div class="exercise-header">
        <strong>${ex.name}</strong>
        <div>
          <button class="reorder-btn" onclick="moveExercise(${i}, -1)">↑</button>
          <button class="reorder-btn" onclick="moveExercise(${i}, 1)">↓</button>
        </div>
      </div>
      <div>Muscle: ${ex.muscle} (Diagram: <img src="placeholder_${ex.muscle}.png" alt="${ex.muscle}" style="width:100px;">)</div>
      <div class="set-row">
        <input type="number" placeholder="Weight" id="w_${i}">
        <input type="number" placeholder="Reps" id="r_${i}">
        <button onclick="logSet(${i})">Log</button>
      </div>
      <div id="sets_${i}"></div>
      <div style="margin-top:0.8rem;display:flex;gap:0.6rem;">
        <button class="danger-btn" onclick="removeExercise(${i})">Remove</button>
        ${withChecks ? `<input type="checkbox" class="select-check" data-idx="${i}"> Select` : ''}
      </div>
    `;
    container.appendChild(card);

    ex.sets.forEach((s, si) => {
      let setDiv = document.createElement('div');
      setDiv.innerHTML = `${s.weight || 'BW'} × ${s.reps} <button class="danger-btn" onclick="removeSet(${i},${si})">×</button>`;
      document.getElementById(`sets_${i}`).appendChild(setDiv);
    });
  });

  if (currentGroup !== null) container.innerHTML += '</div>';
}

function moveExercise(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= currentExercises.length) return;
  [currentExercises[idx], currentExercises[newIdx]] = [currentExercises[newIdx], currentExercises[idx]];
  renderExercises();
}

function logSet(idx) {
  const wEl = document.getElementById(`w_${idx}`);
  const rEl = document.getElementById(`r_${idx}`);
  const w = parseFloat(wEl.value) || 0;
  const r = parseInt(rEl.value);

  if (!r || r < 1) return alert("Enter valid reps");

  currentExercises[idx].sets.push({weight: w, reps: r, time: new Date().toLocaleTimeString()});

  caloriesBurned += Math.round(5 + (bodyweight * 0.1) + (r * 2));
  totalVolume += w * r;

  updateStats();
  renderExercises();

  startRest(120); // 2 minutes

  wEl.value = '';
  rEl.value = '';
}

function removeExercise(idx) {
  if (confirm("Remove exercise?")) {
    currentExercises.splice(idx, 1);
    renderExercises();
  }
}

function removeSet(exIdx, setIdx) {
  if (confirm("Delete set?")) {
    currentExercises[exIdx].sets.splice(setIdx, 1);
    renderExercises();
  }
}

function updateStats() {
  document.getElementById('calDisplay').textContent = caloriesBurned;
  document.getElementById('volDisplay').textContent = totalVolume;
}

function beep() {
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  oscillator.type = 'square';
  oscillator.frequency.value = 800;
  gainNode.gain.value = 0.1;
  oscillator.start();
  setTimeout(() => oscillator.stop(), 150);
}

let restTimer;
function startRest(seconds) {
  clearInterval(restTimer);
  let time = seconds;
  const disp = document.getElementById('restTimer');
  disp.textContent = time;

  restTimer = setInterval(() => {
    time--;
    disp.textContent = time;
    if (time <= 0) {
      clearInterval(restTimer);
      disp.textContent = "GO!";
      beep();
    }
  }, 1000);
}

function finishWorkout() {
  if (currentExercises.length === 0) return alert("No exercises logged.");

  const duration = document.getElementById('workoutTimer').textContent;
  const entry = {
    date: new Date().toLocaleString(),
    duration,
    calories: caloriesBurned,
    volume: totalVolume,
    exercises: currentExercises.map(ex => ({
      name: ex.name,
      muscle: ex.muscle,
      sets: ex.sets
    }))
  };

  history.push(entry);
  localStorage.setItem('benge_history', JSON.stringify(history));

  alert(`Saved!\n${duration} • ${caloriesBurned} kcal • ${totalVolume} lb`);

  currentExercises = [];
  caloriesBurned = 0;
  totalVolume = 0;
  clearInterval(timerInterval);
  document.getElementById('activeWorkout').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
}

function loadHistory() {
  const container = document.getElementById('historyList');
  container.innerHTML = history.length ? '' : '<p>No workouts saved yet.</p>';

  history.slice().reverse().forEach((w, revIdx) => {
    const idx = history.length - 1 - revIdx;
    let item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
      <strong>${w.date}</strong><br>
      Duration: ${w.duration} • ${w.calories} kcal • ${w.volume} lb<br>
      <small>${w.exercises.map(e => e.name).join(' • ')}</small><br>
      <button onclick="toggleHistoryDetails(${idx})">Details</button>
      <div id="hist_details_${idx}" class="hidden"></div>
      <button class="danger-btn" onclick="deleteHistoryEntry(${idx})">Delete</button>
      <button onclick="addToHistoryEntry(${idx})">Add Exercise</button>
    `;
    container.appendChild(item);
  });
}

function toggleHistoryDetails(idx) {
  const details = document.getElementById(`hist_details_${idx}`);
  details.classList.toggle('hidden');
  if (details.innerHTML) return;

  let html = '';
  history[idx].exercises.forEach(ex => {
    html += `<b>${ex.name} (${ex.muscle})</b><br>`;
    ex.sets.forEach(s => html += `${s.time} - ${s.weight || 'BW'} × ${s.reps}<br>`);
    html += '<br>';
  });
  details.innerHTML = html;
}

function deleteHistoryEntry(idx) {
  if (confirm("Delete this workout?")) {
    history.splice(idx, 1);
    localStorage.setItem('benge_history', JSON.stringify(history));
    loadHistory();
  }
}

function addToHistoryEntry(idx) {
  let name = prompt("Add exercise name:");
  if (name) {
    history[idx].exercises.push({name, muscle: 'unknown', sets: []});
    localStorage.setItem('benge_history', JSON.stringify(history));
    loadHistory();
  }
}

function exportHistory() {
  let csv = 'Date,Duration,Calories,Volume,Exercises\n';
  history.forEach(w => {
    let exStr = w.exercises.map(e => `${e.name}: ${e.sets.map(s => `${s.time} - ${s.weight}x${s.reps}`).join('; ')}`).join('| ');
    csv += `${w.date},${w.duration},${w.calories},${w.volume},"${exStr}"\n`;
  });
  const blob = new Blob([csv], {type: 'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'benge_history.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function loadBodyDiagram() {
  const inputs = document.getElementById('sorenessInputs');
  inputs.innerHTML = '';
  ['chest', 'back', 'legs', 'arms', 'shoulders'].forEach(m => {
    let div = document.createElement('div');
    div.innerHTML = `<label>${m.charAt(0).toUpperCase() + m.slice(1)} Soreness %:</label>
      <input type="number" min="0" max="100" value="${muscleSoreness[m] || 0}" onchange="updateSoreness('${m}', this.value)">
    `;
    inputs.appendChild(div);
  });

  updateBodyColors();
}

function updateSoreness(muscle, val) {
  muscleSoreness[muscle] = parseInt(val) || 0;
  localStorage.setItem('benge_soreness', JSON.stringify(muscleSoreness));
  updateBodyColors();
}

function updateBodyColors() {
  Object.keys(muscleSoreness).forEach(m => {
    const el = document.getElementById(m.replace(' ', '-'));
    if (el) {
      el.classList.toggle('muscle-worked', muscleSoreness[m] > 0);
      el.style.opacity = muscleSoreness[m] / 100;
    }
  });
}

function saveSettings() {
  bodyweight = parseInt(document.getElementById('bodyweightInput').value) || 200;
  localStorage.setItem('benge_bw', bodyweight);

  theme = document.getElementById('themeSelect').value;
  localStorage.setItem('benge_theme', theme);
  document.body.classList.toggle('light', theme === 'light');

  alert("Settings saved.");
}

function clearAllData() {
  if (confirm("Delete ALL history?")) {
    history = [];
    localStorage.removeItem('benge_history');
    loadHistory();
  }
}
</script>
</body>
