<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Benge Fitness Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #121212;
      --accent: #0066ff;
      --accent-dark: #004ccc;
      --success: #28a745;
      --danger: #ff4444;
      --text: #e0e0e0;
      --superset: #ff6b6b33;
      --light-bg: #f0f0f0;
      --light-card: #ffffff;
      --light-text: #0a0a0a;
    }
    body.light {
      --bg: var(--light-bg);
      --card: var(--light-card);
      --text: var(--light-text);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    header {
      background: #111;
      padding: 1.1rem;
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      border-bottom: 1px solid #222;
    }
    body.light header { background: #ddd; border-bottom: 1px solid #ccc; }
    .container { max-width: 720px; margin: 0 auto; padding: 1rem; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin: 1.2rem 0;
    }
    .tab {
      padding: 1rem;
      background: #1e1e1e;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
    }
    body.light .tab { background: #ddd; }
    .tab.active { background: var(--accent); color: white; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.3rem;
      margin-bottom: 1.3rem;
      border: 1px solid #222;
    }
    body.light .card { border: 1px solid #ccc; }
    button, select, input {
      padding: 0.8rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
    }
    select, input { background: #1e1e1e; color: white; width: 100%; margin: 0.5rem 0; }
    body.light select, body.light input { background: #f0f0f0; color: black; }
    button { background: var(--accent); color: white; cursor: pointer; }
    button:hover { background: var(--accent-dark); }
    .success-btn { background: var(--success); }
    .success-btn:hover { background: #218838; }
    .danger-btn { background: var(--danger); padding: 0.5rem 1rem; font-size: 0.9rem; }
    .exercise-card {
      background: #181818;
      border-radius: 10px;
      padding: 1.1rem;
      margin-bottom: 1.2rem;
      border: 1px solid #282828;
      display: flex;
      gap: 1rem;
      position: relative;
    }
    body.light .exercise-card { background: #e8e8e8; border: 1px solid #ccc; }
    .exercise-left { width: 120px; flex-shrink: 0; }
    .exercise-left .muscle-img { width: 100%; height: 120px; background: #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; color: #aaa; }
    body.light .exercise-left .muscle-img { background: #ddd; color: #555; }
    .exercise-right { flex: 1; }
    .superset-group { background: var(--superset); padding: 1rem; border-radius: 8px; margin: 1rem 0; position: relative; }
    .arrow-connector {
      position: absolute;
      left: 50%;
      top: 100%;
      width: 2px;
      height: 40px;
      background: #ff6b6b;
      transform: translateX(-50%);
    }
    .arrow-connector::after {
      content: '↓';
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff6b6b;
      font-size: 1.5rem;
    }
    .timer-container { display: flex; justify-content: space-between; align-items: center; }
    .workout-timer { font-size: 3.2rem; font-weight: bold; letter-spacing: 2px; }
    .rest-display { font-size: 2.8rem; font-weight: 600; text-align: center; margin: 1rem 0; }
    .history-item { padding: 1.1rem 0; border-bottom: 1px solid #222; }
    body.light .history-item { border-bottom: 1px solid #ccc; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>Benge Fitness Pro</header>

<div class="container">

  <div class="tabs">
    <div class="tab active" onclick="showTab('workout')">Workout</div>
    <div class="tab" onclick="showTab('history')">History</div>
    <div class="tab" onclick="showTab('progress')">Progress</div>
    <div class="tab" onclick="showTab('settings')">Settings</div>
  </div>

  <!-- WORKOUT TAB -->
  <div id="workoutTab">
    <div class="card" id="startScreen">
      <h3>Start New Workout</h3>
      <select id="categorySelect">
        <option value="Chest">Chest</option>
        <option value="Back">Back</option>
        <option value="Legs">Legs</option>
        <option value="Cardio">Cardio</option>
      </select>
      <button class="success-btn" style="width:100%;margin-top:1rem;font-size:1.1rem;" onclick="startNewWorkout()">Begin</button>
    </div>

    <div id="activeWorkout" class="hidden">
      <div class="card timer-container">
        <div>
          <div class="workout-timer" id="workoutTimer">00:00</div>
          <div style="text-align:center; margin-top:0.5rem;">
            Calories: <b id="calDisplay">0</b> kcal<br>
            Volume: <b id="volDisplay">0</b> lb
          </div>
        </div>
        <button onclick="finishWorkout()" style="font-size:1.1rem;padding:1rem 2rem;align-self:center;">Finish & Save</button>
      </div>

      <div id="exercisesContainer"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin:1.2rem 0;">
        <button class="success-btn" onclick="addExercisePrompt()">+ Add Exercise</button>
        <button onclick="groupSuperset()">Group Superset</button>
      </div>

      <div class="card">
        <h3>Rest Timer</h3>
        <div class="rest-display" id="restTimer">—</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0.6rem;">
          <button onclick="startRest(60)">60s</button>
          <button onclick="startRest(90)">90s</button>
          <button onclick="startRest(120)">120s</button>
          <button onclick="startRest(180)">180s</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HISTORY, PROGRESS, SETTINGS tabs remain the same as previous version -->
  <!-- (Omitted for brevity in this snippet - copy them from your previous working version if needed) -->

</div>

<script>
// ──────────────────────────────────────────────── DATA ────────────────────────────────────────────────
const EXERCISES_BY_MUSCLE = {
  chest: ["Barbell Bench Press", "Incline Bench Press", "Decline Bench Press", "Cable Chest Fly", "Dumbbell Chest Press", "Push-Ups", "Machine Chest Press", "Pec Deck Fly", "Dips (Chest Focus)", "Cable Crossover"],
  back: ["Lat Pulldown", "Seated Cable Row", "Pull-Up", "Deadlift", "Bent-Over Row", "Face Pull", "T-Bar Row", "Hammer Strength Row", "Landmine Row", "Inverted Row"],
  legs: ["Back Squat", "Leg Press", "Romanian Deadlift", "Lunges", "Leg Extension", "Leg Curl", "Hip Thrust", "Calf Raise", "Sumo Deadlift", "Bulgarian Split Squat"],
  arms: ["Bicep Curl", "Hammer Curl", "Tricep Pushdown", "Overhead Tricep Extension", "Skullcrusher", "Preacher Curl", "Concentration Curl", "Tricep Kickback", "Close-Grip Bench", "Chin-Up"],
  shoulders: ["Overhead Press", "Lateral Raise", "Front Raise", "Upright Row", "Arnold Press", "Rear Delt Fly", "Shrug", "Face Pull", "Military Press", "Cable Lateral Raise"]
};

let currentExercises = [];
let caloriesBurned = 0;
let totalVolume = 0;
let workoutStartTime, timerInterval, restInterval;

// ──────────────────────────────────────────────── CORE FUNCTIONS ────────────────────────────────────────────────
function startNewWorkout() {
  currentExercises = [];
  caloriesBurned = 0;
  totalVolume = 0;
  workoutStartTime = Date.now();

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    let sec = Math.floor((Date.now() - workoutStartTime) / 1000);
    let m = Math.floor(sec / 60).toString().padStart(2,'0');
    let s = (sec % 60).toString().padStart(2,'0');
    document.getElementById('workoutTimer').textContent = `${m}:${s}`;
  }, 1000);

  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('activeWorkout').classList.remove('hidden');

  // Load presets (example - customize as needed)
  ["Barbell Bench Press", "Lat Pulldown", "Back Squat", "Treadmill"].forEach(name => addExercise(name));
  renderExercises();
  updateStats();
}

function addExercise(name, muscle = 'unknown') {
  currentExercises.push({
    name,
    muscle,
    sets: []
  });
  renderExercises();
}

function addExercisePrompt() {
  let name = prompt("Enter exercise name:");
  if (name?.trim()) addExercise(name.trim());
}

function renderExercises() {
  const container = document.getElementById('exercisesContainer');
  container.innerHTML = '';

  let prevGroup = null;

  currentExercises.forEach((ex, i) => {
    const groupChanged = ex.supersetGroup !== prevGroup;
    if (groupChanged && prevGroup !== null) {
      container.innerHTML += '</div>'; // close previous superset
    }
    if (groupChanged && ex.supersetGroup !== null) {
      container.innerHTML += '<div class="superset-group">';
      prevGroup = ex.supersetGroup;
    }

    let card = document.createElement('div');
    card.className = 'exercise-card';
    card.innerHTML = `
      <div class="exercise-left">
        <div class="muscle-img">${ex.muscle.toUpperCase()}</div>
      </div>
      <div class="exercise-right">
        <div class="exercise-header">
          <strong>${ex.name}</strong>
          <div>
            <button onclick="moveExercise(${i}, -1)">↑</button>
            <button onclick="moveExercise(${i}, 1)">↓</button>
          </div>
        </div>
        <div class="set-row">
          <input type="number" placeholder="Weight" id="w_${i}">
          <input type="number" placeholder="Reps" id="r_${i}">
          <button onclick="logSet(${i})">Log</button>
        </div>
        <div id="sets_${i}"></div>
        <div style="margin-top:0.8rem;display:flex;gap:0.6rem;">
          <button class="danger-btn" onclick="removeExercise(${i})">Remove</button>
          <button onclick="showReplaceOptions(${i})">Replace</button>
        </div>
      </div>
    `;
    container.appendChild(card);

    ex.sets.forEach((s, si) => {
      let setDiv = document.createElement('div');
      setDiv.innerHTML = `${s.weight || 'BW'} × ${s.reps} <button class="danger-btn" onclick="removeSet(${i},${si})">×</button>`;
      document.getElementById(`sets_${i}`).appendChild(setDiv);
    });

    if (ex.supersetGroup !== null && i < currentExercises.length - 1 && currentExercises[i+1].supersetGroup === ex.supersetGroup) {
      container.innerHTML += '<div class="arrow-connector"></div>';
    }
  });

  if (prevGroup !== null) container.innerHTML += '</div>';
}

function moveExercise(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= currentExercises.length) return;
  [currentExercises[idx], currentExercises[newIdx]] = [currentExercises[newIdx], currentExercises[idx]];
  renderExercises();
}

function logSet(idx) {
  const w = parseFloat(document.getElementById(`w_${idx}`).value) || 0;
  const r = parseInt(document.getElementById(`r_${idx}`).value);

  if (!r || r < 1) return alert("Enter valid reps");

  currentExercises[idx].sets.push({weight: w, reps: r});

  caloriesBurned += Math.round(5 + (200 * 0.1) + (r * 2)); // rough estimate
  totalVolume += w * r;

  updateStats();
  renderExercises();
  startRest(120); // auto 2 min rest after logging set
}

function showReplaceOptions(idx) {
  const muscle = currentExercises[idx].muscle;
  const options = EXERCISES_BY_MUSCLE[muscle] || [];
  if (options.length === 0) return alert("No alternatives found for this muscle");

  let html = "<h4>Replace with (same muscle):</h4><ul style='list-style:none;padding:0;'>";
  options.slice(0, 10).forEach((name, i) => {
    html += `<li><button onclick="replaceExercise(${idx}, '${name}')">${name}</button></li>`;
  });
  html += "</ul>";

  const popup = document.createElement('div');
  popup.style.position = 'fixed';
  popup.style.top = '20%';
  popup.style.left = '50%';
  popup.style.transform = 'translateX(-50%)';
  popup.style.background = 'var(--card)';
  popup.style.padding = '1.5rem';
  popup.style.borderRadius = '12px';
  popup.style.border = '1px solid var(--accent)';
  popup.style.maxWidth = '400px';
  popup.style.zIndex = '1000';
  popup.innerHTML = html + '<button onclick="this.parentElement.remove()" style="margin-top:1rem;">Close</button>';
  document.body.appendChild(popup);
}

function replaceExercise(idx, newName) {
  currentExercises[idx].name = newName;
  renderExercises();
}

function groupSuperset() {
  const selected = prompt("Enter exercise numbers to group as superset (comma separated, e.g. 1,3,5):");
  if (!selected) return;

  const indices = selected.split(',').map(n => parseInt(n.trim()) - 1).filter(n => !isNaN(n));
  if (indices.length < 2) return alert("Select at least 2 exercises");

  const groupId = Date.now();
  indices.forEach(i => currentExercises[i].supersetGroup = groupId);
  renderExercises();
}

// Placeholder functions for other tabs (add your previous code here)
function showTab(tab) { /* ... */ }
function updateStats() {
  document.getElementById('calDisplay').textContent = caloriesBurned;
  document.getElementById('volDisplay').textContent = totalVolume;
}
function startRest(seconds) { /* your beep timer code */ }
function finishWorkout() { /* your finish logic */ }

</script>
</body>
</html>
