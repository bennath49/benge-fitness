<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Benge Fitness Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #121212;
      --accent: #0066ff;
      --accent-dark: #004ccc;
      --success: #28a745;
      --danger: #ff4444;
      --text: #e0e0e0;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 60px;
    }
    header {
      background: #111;
      padding: 1rem;
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      border-bottom: 1px solid #222;
    }
    .container { max-width: 640px; margin: 0 auto; padding: 1rem; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin: 1rem 0;
    }
    .tab {
      padding: 0.9rem;
      background: #1e1e1e;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
    }
    .tab.active {
      background: var(--accent);
      color: white;
    }
    .card {
      background: var(--card);
      border-radius: 10px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      border: 1px solid #222;
    }
    h3 { margin-bottom: 0.8rem; }
    button, select, input {
      padding: 0.7rem;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
    }
    select, input { background: #1e1e1e; color: white; width: 100%; margin: 0.4rem 0; }
    button {
      background: var(--accent);
      color: white;
      cursor: pointer;
    }
    button:hover { background: var(--accent-dark); }
    .success-btn { background: var(--success); }
    .success-btn:hover { background: #218838; }
    .danger-btn { background: var(--danger); font-size: 0.85rem; padding: 0.4rem 0.8rem; }
    .exercise-card {
      background: #181818;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid #282828;
    }
    .exercise-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
    .video-link { color: #4da6ff; cursor: pointer; font-size: 0.9rem; text-decoration: underline; }
    .set-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 0.5rem; margin: 0.5rem 0; }
    .set-row input { text-align: center; }
    .sets-log div { margin: 0.3rem 0; display: flex; justify-content: space-between; align-items: center; }
    .timer { font-size: 3rem; font-weight: bold; text-align: center; margin: 1rem 0; }
    .rest-display { font-size: 2.5rem; text-align: center; margin: 0.8rem 0; }
    .history-item { padding: 1rem 0; border-bottom: 1px solid #222; }
    .hidden { display: none; }
  </style>
</head>
<body>

<header>Benge Fitness Pro</header>

<div class="container">

  <div class="tabs">
    <div class="tab active" onclick="showTab('workout')">Workout</div>
    <div class="tab" onclick="showTab('history')">History</div>
    <div class="tab" onclick="showTab('settings')">Settings</div>
  </div>

  <!-- WORKOUT TAB -->
  <div id="workoutTab">
    <div class="card" id="startScreen">
      <h3>New Workout</h3>
      <select id="categorySelect">
        <option value="Chest">Chest</option>
        <option value="Back">Back</option>
        <option value="Legs">Legs</option>
        <option value="Cardio">Cardio</option>
        <option value="Custom">Custom</option>
      </select>
      <button class="success-btn" style="width:100%;margin-top:0.8rem;" onclick="startNewWorkout()">Start Workout</button>
    </div>

    <div id="activeWorkout" class="hidden">
      <div class="card">
        <div class="timer" id="workoutTimer">00:00</div>
        <div style="text-align:center;margin:0.5rem 0;">
          Calories: <b id="calDisplay">0</b> kcal<br>
          Volume: <b id="volDisplay">0</b> lb
        </div>
        <button onclick="finishWorkout()">Finish & Save</button>
      </div>

      <div id="exercisesContainer"></div>

      <button class="success-btn" style="width:100%;margin:1rem 0;" onclick="addExercisePrompt()">+ Add Exercise</button>

      <div class="card">
        <h3>Rest Timer</h3>
        <div class="rest-display" id="restTimer">—</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0.5rem;">
          <button onclick="startRest(60)">60s</button>
          <button onclick="startRest(90)">90s</button>
          <button onclick="startRest(120)">120s</button>
          <button onclick="startRest(180)">180s</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HISTORY TAB -->
  <div id="historyTab" class="hidden">
    <div class="card">
      <h3>Workout History</h3>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- SETTINGS TAB -->
  <div id="settingsTab" class="hidden">
    <div class="card">
      <h3>Settings</h3>
      <label>Bodyweight (lb):</label>
      <input type="number" id="bodyweightInput" value="200">
      <button style="width:100%;margin-top:1rem;" onclick="saveSettings()">Save Settings</button>
      <button class="danger-btn" style="width:100%;margin-top:1.5rem;" onclick="clearAllData()">Clear All Data</button>
    </div>
  </div>

</div>

<script>
// ──────────────────────────────────────────────── DATA ────────────────────────────────────────────────
const DB = [
  {name:"Barbell Bench Press", demo:"https://www.youtube.com/watch?v=ysUTNll8JQ8"},
  {name:"Incline Barbell Bench Press", demo:"https://www.youtube.com/watch?v=SrqOu55lrYU"},
  {name:"Lat Pulldown", demo:"https://www.youtube.com/watch?v=CAwf7n6Luuc"},
  {name:"Seated Cable Row", demo:"https://www.youtube.com/watch?v=HJSVR_67OlM"},
  {name:"Back Squat", demo:"https://www.youtube.com/watch?v=Dy28eq2PjcM"},
  {name:"Deadlift", demo:"https://www.youtube.com/watch?v=op9kVnSso6Q"},
  {name:"Leg Press", demo:"https://www.youtube.com/watch?v=IZxyjW7MPJQ"},
  {name:"Treadmill Run", demo:"https://www.youtube.com/watch?v=brFHyOtTwH4"}
];

let workoutStartTime, timerIntv, restIntv;
let currentExercises = [];
let caloriesBurned = 0;
let totalVolume = 0;
let bodyweight = parseInt(localStorage.getItem('benge_bw')) || 200;
let history = JSON.parse(localStorage.getItem('benge_history') || '[]');

document.getElementById('bodyweightInput').value = bodyweight;

// ──────────────────────────────────────────────── UI ────────────────────────────────────────────────
function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');

  document.getElementById('workoutTab').classList.toggle('hidden', tab !== 'workout');
  document.getElementById('historyTab').classList.toggle('hidden', tab !== 'history');
  document.getElementById('settingsTab').classList.toggle('hidden', tab !== 'settings');

  if (tab === 'history') loadHistory();
}

function startNewWorkout() {
  currentExercises = [];
  caloriesBurned = 0;
  totalVolume = 0;
  workoutStartTime = Date.now();

  clearInterval(timerIntv);
  timerIntv = setInterval(updateWorkoutTimer, 1000);

  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('activeWorkout').classList.remove('hidden');

  addPresetExercises();
  renderExercises();
  updateStatsDisplay();
}

function updateWorkoutTimer() {
  let sec = Math.floor((Date.now() - workoutStartTime) / 1000);
  let m = Math.floor(sec / 60).toString().padStart(2,'0');
  let s = (sec % 60).toString().padStart(2,'0');
  document.getElementById('workoutTimer').textContent = m + ':' + s;
}

function addPresetExercises() {
  const cat = document.getElementById('categorySelect').value;
  let presets = [];
  if (cat === 'Chest') presets = ["Barbell Bench Press", "Incline Barbell Bench Press"];
  if (cat === 'Back')  presets = ["Lat Pulldown", "Seated Cable Row"];
  if (cat === 'Legs')  presets = ["Back Squat", "Leg Press"];
  if (cat === 'Cardio') presets = ["Treadmill Run"];

  presets.forEach(name => addExercise(name));
}

function addExercisePrompt() {
  let name = prompt("Enter exercise name:");
  if (name && name.trim()) addExercise(name.trim());
}

function addExercise(name) {
  const entry = {
    id: 'ex_' + Date.now(),
    name: name,
    demo: DB.find(e => e.name === name)?.demo || '',
    sets: []
  };
  currentExercises.push(entry);
  renderExercises();
}

function renderExercises() {
  const container = document.getElementById('exercisesContainer');
  container.innerHTML = '';

  currentExercises.forEach((ex, i) => {
    let card = document.createElement('div');
    card.className = 'exercise-card';
    card.innerHTML = `
      <div class="exercise-header">
        <strong>${ex.name}</strong>
        ${ex.demo ? `<span class="video-link" onclick="window.open('${ex.demo}','_blank')">Demo</span>` : ''}
      </div>
      <div class="set-row">
        <input type="number" placeholder="Weight" id="w_${ex.id}">
        <input type="number" placeholder="Reps" id="r_${ex.id}">
        <button onclick="logSet(${i})">Log</button>
      </div>
      <div id="sets_${ex.id}"></div>
      <button class="danger-btn" style="margin-top:0.6rem;" onclick="removeExercise(${i})">Remove Exercise</button>
    `;
    container.appendChild(card);

    ex.sets.forEach((s, si) => {
      let setLine = document.createElement('div');
      setLine.innerHTML = `${s.weight || 'BW'} × ${s.reps} <button class="danger-btn" onclick="removeSet(${i},${si})">×</button>`;
      document.getElementById(`sets_${ex.id}`).appendChild(setLine);
    });
  });
}

function logSet(exIndex) {
  const ex = currentExercises[exIndex];
  const w = parseFloat(document.getElementById('w_' + ex.id).value) || 0;
  const r = parseInt(document.getElementById('r_' + ex.id).value);

  if (!r || r < 1) return alert("Enter valid reps");

  ex.sets.push({weight: w, reps: r});

  // Very rough calorie estimate
  caloriesBurned += Math.round((bodyweight * 0.4536 * 5 * (r < 20 ? 1 : r/10)) / 10);
  totalVolume += w * r;

  updateStatsDisplay();
  renderExercises();

  startRest(90);
  document.getElementById('w_' + ex.id).value = '';
  document.getElementById('r_' + ex.id).value = '';
}

function removeExercise(idx) {
  if (confirm("Remove this exercise?")) {
    currentExercises.splice(idx, 1);
    renderExercises();
  }
}

function removeSet(exIdx, setIdx) {
  if (confirm("Delete this set?")) {
    currentExercises[exIdx].sets.splice(setIdx, 1);
    renderExercises();
  }
}

function updateStatsDisplay() {
  document.getElementById('calDisplay').textContent = caloriesBurned;
  document.getElementById('volDisplay').textContent = totalVolume;
}

let restCountdown;
function startRest(sec) {
  clearInterval(restCountdown);
  let t = sec;
  const disp = document.getElementById('restTimer');
  disp.textContent = t;

  restCountdown = setInterval(() => {
    t--;
    disp.textContent = t > 0 ? t : "GO!";
    if (t <= 0) clearInterval(restCountdown);
  }, 1000);
}

function finishWorkout() {
  if (currentExercises.length === 0) return alert("No exercises logged.");

  const duration = document.getElementById('workoutTimer').textContent;
  const entry = {
    date: new Date().toLocaleString(),
    duration: duration,
    calories: caloriesBurned,
    volume: totalVolume,
    exercises: currentExercises.map(ex => ({
      name: ex.name,
      sets: ex.sets
    }))
  };

  history.push(entry);
  localStorage.setItem('benge_history', JSON.stringify(history));

  alert(`Workout saved!\n${duration} • ${caloriesBurned} kcal • ${totalVolume} lb`);

  // Reset
  currentExercises = [];
  caloriesBurned = 0;
  totalVolume = 0;
  clearInterval(timerIntv);
  document.getElementById('activeWorkout').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
}

function loadHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = history.length === 0 ? "<p>No workouts saved yet.</p>" : "";

  history.slice().reverse().forEach((w, i) => {
    let item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
      <strong>${w.date}</strong><br>
      ${w.duration} • ${w.calories} kcal • ${w.volume} lb<br>
      <small>${w.exercises.map(e => e.name).join(' • ')}</small>
    `;
    list.appendChild(item);
  });
}

function saveSettings() {
  bodyweight = parseInt(document.getElementById('bodyweightInput').value) || 200;
  localStorage.setItem('benge_bw', bodyweight);
  alert("Settings saved.");
}

function clearAllData() {
  if (confirm("Delete ALL workout history?")) {
    history = [];
    localStorage.removeItem('benge_history');
    loadHistory();
  }
}
</script>
</body>
</html>
